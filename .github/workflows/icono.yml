name: compresor de icono
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  comprimir:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[icono]') }}
    steps:
      - uses: actions/checkout@v4
      - name: comprimir icon.png bajo el tope de 128 KB del contrato de Kino
        run: |
          LOG=/tmp/icono.log
          echo "=== compresor de icono v2 (ImageMagick) ===" > "$LOG"
          HERR=none
          if command -v convert >/dev/null 2>&1; then HERR=convert; fi
          if [ "$HERR" = none ] && command -v magick >/dev/null 2>&1; then HERR=magick; fi
          echo "herramienta: $HERR" >> "$LOG"
          $HERR -version 2>&1 | head -2 >> "$LOG"
          identify icon.png >> "$LOG" 2>&1
          if [ "$HERR" = none ]; then echo "FALTA ImageMagick" >> "$LOG"; exit 1; fi
          LIMITE=131072
          W=$(identify -format '%w' icon.png 2>>"$LOG")
          H=$(identify -format '%h' icon.png 2>>"$LOG")
          echo "dimensiones: ${W}x${H}" >> "$LOG"
          ORIG=icon.png
          if [ -n "$W" ] && [ -n "$H" ] && [ "$W" -ne "$H" ] 2>/dev/null; then
            ESQ=$(identify -format '%[pixel:p{0,0}]' icon.png 2>>"$LOG")
            MAYOR=$(( W > H ? W : H ))
            convert icon.png -gravity center -background "$ESQ" -extent ${MAYOR}x${MAYOR} /tmp/cuadrado.png >> "$LOG" 2>&1
            ORIG=/tmp/cuadrado.png
            echo "no era cuadrado: acolchado a ${MAYOR}x${MAYOR} con fondo $ESQ" >> "$LOG"
          fi
          ELEGIDO=""
          for LADO in 512 384 320 256; do
            for MODO in full paleta; do
              if [ "$MODO" = full ]; then
                convert "$ORIG" -resize ${LADO}x${LADO} -strip PNG24:/tmp/c.png >> "$LOG" 2>&1
              else
                convert "$ORIG" -resize ${LADO}x${LADO} -strip -colors 255 -depth 8 PNG8:/tmp/c.png >> "$LOG" 2>&1
              fi
              S=$(stat -c%s /tmp/c.png 2>/dev/null || echo 999999)
              echo "intento ${LADO}px ${MODO}: ${S} bytes" >> "$LOG"
              if [ "$S" -le "$LIMITE" ]; then ELEGIDO=/tmp/c.png; break 2; fi
            done
          done
          if [ -z "$ELEGIDO" ]; then
            echo "NINGUN intento bajo el limite de 128 KB" >> "$LOG"
            exit 1
          fi
          cp "$ELEGIDO" icon.png
          echo "FINAL: $(stat -c%s icon.png) bytes" >> "$LOG"
          identify icon.png >> "$LOG" 2>&1
      - name: commit
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon.png
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "[icono] icon.png comprimido bajo el tope de 128 KB del contrato de Kino"
            git push
          fi
      - name: bitacora
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/icono.log icono-debug.txt
          git add icono-debug.txt
          if ! git diff --cached --quiet; then
            git commit -m "[icono] bitacora del compresor (fallo)"
            git push
          fi
