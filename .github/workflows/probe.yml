name: probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: sondear
        run: |
          set +e
          python3 - <<'PY' > probe-result.txt
          import re, urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          def get(url, ref='https://veranime.ninja/'):
              h = {'User-Agent': UA, 'Referer': ref, 'Accept': 'text/html,*/*', 'Accept-Language': 'es-ES,es;q=0.9'}
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return 0, 'ERR ' + str(e)
          print('=== IVA: poster de heroe por slug ===')
          st, b = get('https://ivanime.buzz/', 'https://ivanime.buzz/')
          for slug in ['to-aru-anbu-no-item-sub-espanol', 'tantei-wa-mo-shindeiru-temporada-2-sub-espanol', 'kanojo-no-tomodachi-sub-espanol']:
              base = re.sub(r'-(sub-)?espanol$', '', slug)
              m = re.search(r'https?://[^\s"\'<>]*' + base + r'-portada-[^\s"\'<>]+?\.(?:jpe?g|png|webp)', b)
              print(slug, '-> base', base, '->', m.group(0) if m else 'NO HALLADO')
          print()
          print('=== VAN: ficha de ejemplo para listar generos ===')
          st, g = get('https://veranime.ninja/genero/ver-anime/')
          m = re.search(r'/anime/([^"\'/?#]+)', g)
          print('genero ver-anime status', st, 'primer slug:', m.group(1) if m else 'no')
          if m:
              st, f = get('https://veranime.ninja/anime/' + m.group(1) + '/')
              print('ficha status', st, 'bytes', len(f))
              gens = []
              for mm in re.finditer(r'href\s*=\s*["\'][^"\']*/genero/([^"\'/?#]+)', f):
                  if mm.group(1) not in gens: gens.append(mm.group(1))
              print('generos de la ficha:', gens)
          print()
          print('=== VAN: generos candidatas ===')
          for gen in ['accion', 'shonen', 'romance', 'comedia', 'drama', 'aventura', 'fantasia', 'escolar', 'misterio', 'sobrenatural', 'terror', 'accion-latino', 'peliculas']:
              st, b2 = get('https://veranime.ninja/genero/' + gen + '/')
              n = len(re.findall(r'/anime/([^"\'/?#]+)', b2))
              pg = re.findall(r'P[áa]gina\s+(\d+)\s+de\s+(\d+)', b2)
              print('genero', gen, '-> status', st, 'bytes', len(b2), 'anclas anime', n, 'paginacion', pg[:1])
          print()
          print('=== VAN: paginacion de genero ===')
          st, b3 = get('https://veranime.ninja/genero/accion/page/2/')
          n = len(re.findall(r'/anime/([^"\'/?#]+)', b3))
          print('accion/page/2 -> status', st, 'bytes', len(b3), 'anclas anime', n)
          st, b3b = get('https://veranime.ninja/genero/accion/?page=2')
          n = len(re.findall(r'/anime/([^"\'/?#]+)', b3b))
          print('accion?page=2 -> status', st, 'bytes', len(b3b), 'anclas anime', n)
          print()
          print('=== VAN: /temporada/ ===')
          st, b4 = get('https://veranime.ninja/temporada/')
          n_an = len(re.findall(r'/anime/([^"\'/?#]+)', b4))
          n_t = len(re.findall(r'/temporada/([^"\'/?#]+)', b4))
          print('/temporada/ -> status', st, 'bytes', len(b4), 'anclas anime', n_an, 'anclas temporada', n_t)
          print('primeros 600:', repr(b4[:600]))
          print()
          print('=== VAN: EPISODIOS RECIENTES de la home (que enlazan) ===')
          st, b5 = get('https://veranime.ninja/')
          i = b5.find('EPISODIOS RECIENTES')
          seg = b5[i:i+4000] if i >= 0 else ''
          hrefs = re.findall(r'href\s*=\s*["\']([^"\']+)["\']', seg)
          print('hrefs tras EPISODIOS RECIENTES (primeros 15):', hrefs[:15])
          PY
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe v31: resultados [skip ci]" || echo "nada"
          git push

