name: probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: sondear
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          R=probe-result.txt
          : > "$R"
          echo "=== JARA EMBED ===" >> "$R"
          curl -sL --compressed -A "$UA" "https://multiplayer1.streamhj.top/player/multiplayer/embed1.php?idanime=4913&idcapitulo=5" -o /tmp/emb.html
          echo "bytes: $(wc -c < /tmp/emb.html)" >> "$R"
          grep -Eo "<iframe[^>]{0,250}" /tmp/emb.html | head -8 >> "$R"
          grep -Eo "https://[a-zA-Z0-9./?=_&%-]*(mp4|m3u8)" /tmp/emb.html | sort -u | head -15 >> "$R"
          grep -Eo "(onclick|data-url|data-player|data-file)=\"[^\"]{0,160}\"" /tmp/emb.html | head -25 >> "$R"
          grep -Ei -o "(filemoon|dood|streamwish|voe|mp4upload|mixdrop|uqload|ok\.ru|streamtape)[a-z0-9./?=_&%-]{0,120}" /tmp/emb.html | sort -u | head -25 >> "$R"
          grep -Ei -A 20 "servidor|option" /tmp/emb.html | head -80 >> "$R"
          echo "=== JARA EPISODE IDIOMAS ===" >> "$R"
          curl -sL --compressed -A "$UA" "https://animejara.com/episode/dragon-ball-super-beerus-1x5/" -o /tmp/e.html
          grep -Eo "cambiarIdioma\([^)]*\)" /tmp/e.html | head -10 >> "$R"
          grep -Eo "embed[0-9]\.php[^\"' ]{0,120}" /tmp/e.html | sort -u | head -10 >> "$R"
          grep -Eo "streamhj[^\"' ]{0,150}" /tmp/e.html | sort -u | head -10 >> "$R"
          grep -Ei -B2 -A25 "function cambiarIdioma" /tmp/e.html | head -90 >> "$R"
          echo "=== JARA EMISION TARJETA ===" >> "$R"
          grep -E -B6 -A10 "anime/black-clover" /tmp/m.html 2>/dev/null | head -70 >> "$R"
          curl -sL --compressed -A "$UA" "https://animejara.com/emision" -o /tmp/m.html
          grep -E -B6 -A10 "anime/black-clover" /tmp/m.html | head -70 >> "$R"
          echo "=== JARA FICHA TEMPORADAS ===" >> "$R"
          curl -sL --compressed -A "$UA" "https://animejara.com/anime/ranma-12-2024" -o /tmp/f2.html
          echo "bytes: $(wc -c < /tmp/f2.html)" >> "$R"
          grep -Eo "data-season=\"[0-9]+\"" /tmp/f2.html | sort -u >> "$R"
          grep -Eo "<span>[0-9]+ episodios</span>" /tmp/f2.html >> "$R"
          grep -Eo "href=\"[^\"]*episode[^\"]*\"" /tmp/f2.html | sort -u | head -20 >> "$R"
          echo "=== VAN EPISODIO ===" >> "$R"
          curl -sL --compressed -A "$UA" "https://veranime.ninja/ver/tensei-kizoku-kantei-skill-de-nariagaru-episodio-1/" -o /tmp/ve.html
          echo "bytes: $(wc -c < /tmp/ve.html)" >> "$R"
          grep -Eo "<iframe[^>]{0,250}" /tmp/ve.html | head -8 >> "$R"
          grep -Eo "data-post=\"[^\"]*\"" /tmp/ve.html | sort -u | head -10 >> "$R"
          grep -Eo "dooplayer[^\"' ]{0,100}" /tmp/ve.html | sort -u | head -10 >> "$R"
          grep -Eo "onclick=\"[^\"]{0,160}\"" /tmp/ve.html | sort -u | head -25 >> "$R"
          grep -Eo "(id|class)=\"[a-z-]*(player|option|server)[a-z-]*\"" /tmp/ve.html | sort -u | head -25 >> "$R"
          grep -Ei -B3 -A30 "reproductor|player-options|pserver|option-player" /tmp/ve.html | head -120 >> "$R"
          echo "=== VAN TARJETA GENERO ===" >> "$R"
          curl -sL --compressed -A "$UA" "https://veranime.ninja/genero/ver-anime/" -o /tmp/v.html
          grep -E -B6 -A8 "image.tmdb.org/t/p/w185" /tmp/v.html | head -60 >> "$R"
          echo "=== VAN SEARCH ===" >> "$R"
          curl -sL --compressed -A "$UA" "https://veranime.ninja/?s=yaiba" -o /tmp/vs.html
          echo "bytes: $(wc -c < /tmp/vs.html)" >> "$R"
          grep -Eo "href=\"[^\"]*(online|anime|pelicula|temporada)/[^\"]*\"" /tmp/vs.html | sort -u | head -15 >> "$R"
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe v15: resultados [skip ci]" || echo "nada"
          git push
