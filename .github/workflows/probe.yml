name: probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: sondear
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          R=probe-result.txt
          : > "$R"
          curl -sL --compressed -A "$UA" -H "Referer: https://veranime.ninja/" -w "HTTP %{http_code}\n" "https://veranime.ninja/ver/cyberpunk-edgerunners-episodio-1/" -o /tmp/ep.html >> "$R" 2>&1
          curl -sL --compressed -A "$UA" -H "Referer: https://ivanime.buzz/" -w "HTTP %{http_code}\n" "https://ivanime.buzz/build/assets/app-CFHQxs1u.js" -o /tmp/app.js >> "$R" 2>&1
          curl -sL --compressed -A "$UA" -H "Referer: https://ivanime.buzz/" -w "HTTP %{http_code}\n" "https://ivanime.buzz/" -o /tmp/ivahome.html >> "$R" 2>&1
          python3 - <<'PY' >> "$R"
          import re, urllib.request, urllib.parse
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          def get(url, ref, data=None, extra=None):
              h = {'User-Agent': UA, 'Referer': ref, 'Accept': '*/*'}
              if extra: h.update(extra)
              req = urllib.request.Request(url, headers=h, data=data)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return 0, 'ERR ' + str(e)
          print('=== VAN EP: JS DEL LI ===')
          ep = open('/tmp/ep.html', encoding='utf-8', errors='replace').read()
          i = ep.find('dooplay_player_option')
          if i >= 0:
              j = ep.find('playeroptionsul')
              print('--- UL:', repr(ep[max(0,j-300):j+600]) if j>=0 else 'no ul')
          for m in list(re.finditer(r'<script\b[^>]*>([\s\S]*?)</script>', ep))[:40]:
              s = m.group(1)
              if 'player' in s.lower() or 'ajax' in s.lower() or 'nonce' in s.lower():
                  if len(s.strip()) > 20:
                      print('--- SCRIPT:', repr(s[:1800]))
          for m in list(re.finditer(r'ajaxurl|dooplayer|player_option|doo_', ep))[:30]:
              i2 = m.start()
              print('--- CTX:', repr(ep[max(0,i2-250):i2+250]))
          print('=== VAN AJAX POST ===')
          for acc in ['doo_player', 'get_player']:
              d = urllib.parse.urlencode({'action': acc, 'post': '7870', 'nume': '1', 'type': 'tv'}).encode()
              st, b = get('https://veranime.ninja/wp-admin/admin-ajax.php', 'https://veranime.ninja/ver/cyberpunk-edgerunners-episodio-1/', data=d, extra={'X-Requested-With': 'XMLHttpRequest'})
              print('POST', acc, '->', st, '|', repr(b[:400]))
          print('=== IVA APP.JS: rutas de episodios ===')
          js = open('/tmp/app.js', encoding='utf-8', errors='replace').read()
          print('bytes:', len(js))
          pats = [r'episodio', r'/ver/', r'capitulo', r'ajax', r'fetch\(', r'\.get\(', r'axios']
          vistos = set()
          for p in pats:
              for m in list(re.finditer(p, js, re.I))[:8]:
                  i3 = m.start()
                  key = i3 // 100
                  if key in vistos: continue
                  vistos.add(key)
                  print('--- JS CTX', p, ':', repr(js[max(0,i3-200):i3+260]))
          print('=== IVA: endpoints probables ===')
          for u in ['https://ivanime.buzz/anime/kanojo-no-tomodachi-sub-espanol/episodios',
                    'https://ivanime.buzz/anime/kanojo-no-tomodachi-sub-espanol/capitulos',
                    'https://ivanime.buzz/api/anime/kanojo-no-tomodachi-sub-espanol',
                    'https://ivanime.buzz/anime/kanojo-no-tomodachi-sub-espanol?page=2']:
              st, b = get(u, 'https://ivanime.buzz/')
              print(u, '->', st, '| len:', len(b), '|', repr(b[:250]))
          print('=== IVA HOME: tarjeta de listado ===')
          home = open('/tmp/ivahome.html', encoding='utf-8', errors='replace').read()
          m4 = re.search(r'href\s*=\s*["\'][^"\']*/anime/[^"\']+["\']', home)
          if m4:
              i4 = m4.start()
              print('--- CARD CTX:', repr(home[max(0,i4-600):i4+1200]))
          PY
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe v24: resultados [skip ci]" || echo "nada"
          git push
