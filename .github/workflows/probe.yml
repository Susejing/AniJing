name: probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: sondear
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          R=probe-result.txt
          : > "$R"
          curl -sL --compressed -A "$UA" -H "Referer: https://animejara.com/" -w "HTTP %{http_code}\n" "https://animejara.com/catalogo" -o /tmp/c1.html >> "$R" 2>&1
          python3 - <<'PY' >> "$R"
          import re
          h = open('/tmp/c1.html', encoding='utf-8', errors='replace').read()
          print('bytes:', len(h), '| imgs hj:', len(re.findall(r'hj\.animejara\.com', h)))
          anclas = list(re.finditer(r'<a\b[^>]*href="https://animejara\.com/anime/[^"]*"[^>]*>', h))
          print('anclas /anime/:', len(anclas))
          for a in anclas[:3]:
              i = a.start()
              print('--- ANCLA en', i, ':', repr(h[max(0,i-350):i+700]))
          i = h.find('death-note')
          print('--- death-note idx', i)
          if i >= 0:
              print(repr(h[max(0,i-500):i+500]))
          print('--- data-src o lazy:', re.findall(r'data-(?:src|lazy)[^=]*="([^"]+)"', h)[:5])
          PY
          echo "=== PAGINA 2 ===" >> "$R"
          curl -sL --compressed -A "$UA" -H "Referer: https://animejara.com/" -w "HTTP %{http_code}\n" "https://animejara.com/catalogo?page=2" -o /tmp/c2.html >> "$R" 2>&1
          python3 - <<'PY' >> "$R"
          import re
          h = open('/tmp/c2.html', encoding='utf-8', errors='replace').read()
          print('bytes:', len(h), '| imgs hj:', len(re.findall(r'hj\.animejara\.com', h)))
          anclas = list(re.finditer(r'<a\b[^>]*href="https://animejara\.com/anime/[^"]*"[^>]*>', h))
          print('anclas /anime/:', len(anclas))
          for a in anclas[:2]:
              i = a.start()
              print('--- ANCLA en', i, ':', repr(h[max(0,i-350):i+700]))
          PY
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe v21: resultados [skip ci]" || echo "nada"
          git push
