name: probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: sondear
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          R=probe-result.txt
          : > "$R"
          echo "=== JARA FICHA ===" >> "$R"
          curl -sL --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" "https://animejara.com/anime/dragon-ball-super-beerus" -o /tmp/f.html
          echo "bytes: $(wc -c < /tmp/f.html)" >> "$R"
          grep -Eo "api-web[^\"' ]*" /tmp/f.html | sort -u | head -30 >> "$R"
          grep -Eo "admin-ajax[^\"' ]*" /tmp/f.html | sort -u | head -10 >> "$R"
          grep -Eo "data-[a-zA-Z-]+=\"[^\"]{0,50}\"" /tmp/f.html | sort -u | head -70 >> "$R"
          grep -Eo "href=\"[^\"]*episode[^\"]*\"" /tmp/f.html | sort -u | head -30 >> "$R"
          grep -Ei -A 40 "Temporadas" /tmp/f.html | head -120 >> "$R"
          echo "=== JARA EPISODE ===" >> "$R"
          curl -sL --compressed -A "$UA" "https://animejara.com/episode/dragon-ball-super-beerus-1x5/" -o /tmp/e.html
          echo "bytes: $(wc -c < /tmp/e.html)" >> "$R"
          grep -Eo "<iframe[^>]{0,200}" /tmp/e.html | head -10 >> "$R"
          grep -Eo "api-web[^\"' ]*" /tmp/e.html | sort -u | head -20 >> "$R"
          grep -Eo "data-[a-zA-Z-]+=\"[^\"]{0,60}\"" /tmp/e.html | sort -u | head -70 >> "$R"
          grep -Eo "https://[a-zA-Z0-9./?=_-]*(mp4|m3u8)" /tmp/e.html | sort -u | head -15 >> "$R"
          grep -Ei -o "player[a-z-]*" /tmp/e.html | sort -u | head -25 >> "$R"
          grep -Ei -A 25 "reproductor|player-container|video-container" /tmp/e.html | head -90 >> "$R"
          echo "=== JARA EMISION ===" >> "$R"
          curl -sL --compressed -A "$UA" "https://animejara.com/emision" -o /tmp/m.html
          echo "bytes: $(wc -c < /tmp/m.html)" >> "$R"
          grep -Eo "href=\"[^\"]*anime/[^\"]*\"" /tmp/m.html | sort -u | head -40 >> "$R"
          grep -Eo "<img[^>]{0,180}" /tmp/m.html | head -15 >> "$R"
          echo "=== JARA CATALOGO ===" >> "$R"
          curl -sL --compressed -A "$UA" "https://animejara.com/catalogo" -o /tmp/c.html
          echo "bytes: $(wc -c < /tmp/c.html)" >> "$R"
          grep -Eo "href=\"[^\"]*anime/[^\"]*\"" /tmp/c.html | sort -u | head -40 >> "$R"
          echo "=== VAN GENERO ===" >> "$R"
          curl -sL --compressed -A "$UA" "https://veranime.ninja/genero/ver-anime/" -o /tmp/v.html
          echo "bytes: $(wc -c < /tmp/v.html)" >> "$R"
          grep -Eo "data-post=\"[^\"]*\"" /tmp/v.html | head -5 >> "$R"
          grep -Eo "href=\"[^\"]*episodio[^\"]*\"" /tmp/v.html | sort -u | head -10 >> "$R"
          grep -Eo "data-src=\"[^\"]*\"" /tmp/v.html | head -5 >> "$R"
          echo "=== VAN FICHA ===" >> "$R"
          curl -sL --compressed -A "$UA" "https://veranime.ninja/online/shin-samurai-den-yaiba/" -o /tmp/vf.html
          echo "bytes: $(wc -c < /tmp/vf.html)" >> "$R"
          grep -Eo "playeroptionsul.{0,300}" /tmp/vf.html | head -3 >> "$R"
          grep -Eo "data-post=\"[^\"]*\"" /tmp/vf.html | sort -u | head -10 >> "$R"
          grep -Eo "href=\"[^\"]*episodio[^\"]*\"" /tmp/vf.html | sort -u | head -15 >> "$R"
          echo "=== VAN DOOPLAYER ===" >> "$R"
          for P in $(grep -Eo "data-post=\"[0-9]+\"" /tmp/vf.html | grep -Eo "[0-9]+" | sort -u | head -3); do
            T=$(grep -E "data-post=\"$P\"" /tmp/vf.html | grep -Eo "data-type=\"[a-z]+\"" | head -1 | grep -Eo "[a-z]+$")
            N=$(grep -E "data-post=\"$P\"" /tmp/vf.html | grep -Eo "data-nume=\"[0-9]+\"" | head -1 | grep -Eo "[0-9]+$")
            echo "post $P type $T nume $N" >> "$R"
            curl -sL --compressed -A "$UA" "https://veranime.ninja/wp-json/dooplayer/v1/post/$P?type=$T&source=$N" >> "$R"
            echo "" >> "$R"
          done
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe v14: resultados [skip ci]" || echo "nada"
          git push
