name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probes
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          P=probe-result.txt
          : > "$P"
          f() { curl -sL --compressed --max-time 30 -A "$UA" -H 'Accept: text/html,application/xhtml+xml,*/*' -H 'Accept-Language: es-ES,es;q=0.9' -H "Referer: $2" "$1"; }
          {
          echo "===== IVA emision ====="
          f https://ivanime.buzz/emision https://ivanime.buzz/ > ivaem.html
          wc -c ivaem.html
          grep -oE '<a [^>]*href="[^"]*ivanime\.buzz/anime/[^"]*"[^>]*>' ivaem.html | head -4
          grep -oE '<img[^>]*>' ivaem.html | head -6
          grep -oE 'href="[^"]*page[=][0-9]+[^"]*"' ivaem.html | sort -u | head -8
          echo "===== IVA animes ====="
          f https://ivanime.buzz/animes https://ivanime.buzz/ > ivaan.html
          wc -c ivaan.html
          grep -oE '<a [^>]*href="[^"]*ivanime\.buzz/anime/[^"]*"[^>]*>' ivaan.html | head -4
          grep -oE '<img[^>]*>' ivaan.html | head -6
          grep -oE 'href="[^"]*page[=][0-9]+[^"]*"' ivaan.html | sort -u | head -8
          echo "===== OTV genero latino ====="
          f 'https://www.otakustv.net/animes?genero=anime-latino' https://www.otakustv.net/ > otvlat.html
          wc -c otvlat.html
          grep -oE '<img[^>]*>' otvlat.html | head -6
          grep -oE 'href="[^"]*animes[^"]*"' otvlat.html | sort -u | head -10
          echo "===== OTV genero latino pag2 ====="
          f 'https://www.otakustv.net/animes?genero=anime-latino&pag=2' https://www.otakustv.net/ > otvlat2.html
          wc -c otvlat2.html
          grep -oE '<img[^>]*>' otvlat2.html | head -4
          echo "===== AON pelicula ====="
          f https://animeonline.ninja/pelicula/ https://animeonline.ninja/ > aonp.html
          wc -c aonp.html
          grep -oE '<img[^>]*>' aonp.html | wc -l
          grep -oE '<img[^>]*>' aonp.html | head -5
          grep -oiE 'just a moment|cf-chl' aonp.html | head -2
          echo "===== AON en-emision ====="
          f https://animeonline.ninja/genero/en-emision-1/ https://animeonline.ninja/ > aone.html
          wc -c aone.html
          grep -oE '<img[^>]*>' aone.html | wc -l
          grep -oE '<img[^>]*>' aone.html | head -4
          echo "===== AON audio-latino ====="
          f https://animeonline.ninja/genero/audio-latino/ https://animeonline.ninja/ > aonl.html
          wc -c aonl.html
          grep -oE '<img[^>]*>' aonl.html | wc -l
          grep -oE '<img[^>]*>' aonl.html | head -4
          echo "===== EAS pelicula anclas ====="
          f https://estrenosanime.net/tipo/Pelicula https://estrenosanime.net/ | grep -oE '<a [^>]*href="[^"]*/(anime|ver)/[^"]*"[^>]*>' | head -6
          } >> "$P" 2>&1
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe v10: resultados [skip ci]" || echo "nada"
          git push
