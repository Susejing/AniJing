name: probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: sondear
        run: |
          set +e
          python3 - <<'PY' > probe-result.txt
          import re, urllib.request, urllib.parse, json
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          def get(url, ref, data=None, extra=None):
              h = {'User-Agent': UA, 'Referer': ref, 'Accept': '*/*'}
              if extra: h.update(extra)
              req = urllib.request.Request(url, headers=h, data=data)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return 0, 'ERR ' + str(e)
          print('=== VAN doo_player_ajax (7870 tv 1) ===')
          d = urllib.parse.urlencode({'action': 'doo_player_ajax', 'post': '7870', 'nume': '1', 'type': 'tv'}).encode()
          st, b = get('https://veranime.ninja/wp-admin/admin-ajax.php', 'https://veranime.ninja/ver/cyberpunk-edgerunners-episodio-1/', data=d, extra={'X-Requested-With': 'XMLHttpRequest', 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'})
          print('status:', st, '| body:', repr(b[:600]))
          embed = ''
          try:
              j = json.loads(b)
              embed = (j.get('embed_url') or '').replace('\\/', '/')
              print('type:', j.get('type'), '| embed_url:', embed)
          except Exception as e:
              print('json ERR', str(e)[:100])
          if embed:
              print('=== VAN EMBED (darkanimes) ===')
              st2, b2 = get(embed, 'https://veranime.ninja/')
              print('status:', st2, '| bytes:', len(b2))
              print('--- CABEZA:', repr(b2[:2500]))
              for m in list(re.finditer(r"\(\s*['\"](https?://[^'\"]+)['\"]\s*\)", b2))[:20]:
                  print('ONCLICK:', m.group(1))
              for m in list(re.finditer(r'data-player\s*=\s*["\']([A-Za-z0-9+/=]+)["\']', b2))[:10]:
                  import base64
                  try: dec = base64.b64decode(m.group(1)).decode('utf-8','replace')
                  except Exception: dec = '???'
                  print('DATA-PLAYER:', dec[:200])
              for m in list(re.finditer(r'<iframe\b[^>]*>', b2))[:5]:
                  print('--- IFRAME:', repr(m.group(0)[:300]))
          print('=== VAN doo_player_ajax de una PELICULA por si acaso ===')
          print('(omitido)')
          PY
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe v28: resultados [skip ci]" || echo "nada"
          git push
