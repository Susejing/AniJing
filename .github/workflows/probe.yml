name: probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: sondear
        run: |
          set +e
          python3 - <<'PY' > probe-result.txt
          import re, urllib.request, time
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          UAMOB='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36'
          def get(url, ref=None, ua=UA, binaria=False):
              h={'User-Agent': ua, 'Accept':'text/html,*/*', 'Accept-Language':'es-ES,es;q=0.9'}
              if ref: h['Referer']=ref
              req=urllib.request.Request(url, headers=h)
              t0=time.time()
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data=r.read()
                      dt=round(time.time()-t0,1)
                      if binaria: return r.status, r.headers.get('Content-Type','?'), len(data), dt
                      return r.status, data.decode('utf-8','replace'), dt
              except Exception as e:
                  dt=round(time.time()-t0,1)
                  if binaria: return 0, str(e)[:90], -1, dt
                  return 0, 'ERR '+str(e)[:120], dt
          def poster_de(html, slug):
              bases=[slug, re.sub(r'-(sub-)?(espanol|castellano|latino)$','',slug)]
              for base in bases:
                  m=re.search(r'https?://[^\s\'"<>]*/portada/[^\s\'"<>]*'+re.escape(base)+r'-[^\s\'"<>]*?\.(?:jpe?g|png|webp)', html, re.I)
                  if m: return m.group(0)
              return None
          print('=== IVA: home desktop, poster por nombre (regex del maestro) ===')
          st,b,s=get('https://ivanime.buzz/', ref='https://ivanime.buzz/')
          print('HOME status',st,'bytes',len(b),'secs',s)
          slugs=[]
          for m in re.finditer(r'href="[^"]*?/anime/([^/"?#]+)/"', b):
              if m.group(1) not in slugs: slugs.append(m.group(1))
          print('slugs /anime/ (primeros 12):', slugs[:12])
          portadas=re.findall(r'https?://[^\s\'"<>]*/portada/[^\s\'"<>]+\.(?:jpe?g|png|webp)', b, re.I)
          print('URLs /portada/ del html (primeras 12):')
          for u in portadas[:12]: print('  ',u)
          halladas=[]
          for slug in slugs[:10]:
              u=poster_de(b, slug)
              print('  ',slug,'->', u if u else 'NO HALLADO')
              if u and len(halladas)<3: halladas.append(u)
          i=b.find('/portada/')
          print('contexto primera /portada/ (idx',i,'):')
          print(repr(b[max(0,i-350):i+250]))
          print()
          print('=== IVA: /emision y /animes crudos ===')
          thumbs=[]
          for camino in ['/emision','/animes','/emision/','/animes/']:
              st3,b3,s3=get('https://ivanime.buzz'+camino, ref='https://ivanime.buzz/')
              n=len(set(re.findall(r'href="[^"]*?/anime/([^/"?#]+)/"', b3)))
              print(camino,'-> status',st3,'bytes',len(b3),'secs',s3,'anclas anime',n,'data-src',b3.count('data-src'))
              if st3==200 and len(b3)>5000:
                  k=b3.find('/anime/')
                  print('  primera tarjeta:',repr(b3[max(0,k-300):k+130]))
                  mt=re.search(r'data-src="([^"]+)"', b3)
                  if mt and len(thumbs)<2: thumbs.append(mt.group(1))
          print()
          print('=== IVA: las imagenes cargan sin galleta? ===')
          for u in halladas:
              st4,ct,n4,s4=get(u, ref=None, binaria=True)
              print(u[:110],'-> SIN referer:',st4,ct,n4,'bytes',s4,'s')
              st4b,ctb,n4b,s4b=get(u, ref='https://ivanime.buzz/', binaria=True)
              print(u[:110],'-> CON referer:',st4b,ctb,n4b,'bytes',s4b,'s')
          for u in thumbs:
              st4,ct,n4,s4=get(u, ref=None, binaria=True)
              print(u[:110],'-> SIN referer:',st4,ct,n4,'bytes',s4,'s')
          print()
          print('=== IVA: home con UA Android (como el telefono) ===')
          st5,b5,s5=get('https://ivanime.buzz/', ref='https://ivanime.buzz/', ua=UAMOB)
          print('HOME movil status',st5,'bytes',len(b5),'secs',s5)
          slugs5=[]
          for m in re.finditer(r'href="[^"]*?/anime/([^/"?#]+)/"', b5):
              if m.group(1) not in slugs5: slugs5.append(m.group(1))
          print('slugs moviles (primeros 8):', slugs5[:8])
          portadas5=re.findall(r'https?://[^\s\'"<>]*/portada/[^\s\'"<>]+\.(?:jpe?g|png|webp)', b5, re.I)
          print('URLs /portada/ moviles (primeras 8):')
          for u in portadas5[:8]: print('  ',u)
          for slug in slugs5[:4]:
              u=poster_de(b5, slug)
              print('  ',slug,'->', u if u else 'NO HALLADO')
          i5=b5.find('/portada/')
          print('contexto primera /portada/ movil (idx',i5,'):')
          print(repr(b5[max(0,i5-350):i5+250]))
          PY
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe v32: resultados [skip ci]" || echo "nada"
          git push

