name: probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: sondear
        run: |
          set +e
          python3 - <<'PY' > probe-result.txt
          import re, urllib.request, urllib.parse, json
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          def get(url, ref, data=None, extra=None):
              h = {'User-Agent': UA, 'Referer': ref, 'Accept': '*/*'}
              if extra: h.update(extra)
              req = urllib.request.Request(url, headers=h, data=data)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return 0, 'ERR ' + str(e)
          print('=== VAN EMBED COMPLETO ===')
          st, b = get('https://darkanimes.com/cyberpunk-edgerunners-1/', 'https://veranime.ninja/')
          print('bytes:', len(b))
          i = b.find('msp-lists')
          print('--- MSP-LISTS:', repr(b[i-100:i+3500]) if i>=0 else 'no')
          m = re.search(r'data-api\s*=\s*["\']([^"\']+)["\']', b)
          api = m.group(1) if m else ''
          print('API:', api)
          print('=== MSP API ===')
          if api:
              for q in ['', '?lang=1', '?lang=2', '?lang=3']:
                  st2, b2 = get(api + q, 'https://darkanimes.com/')
                  print('API' + q, '->', st2, '|', repr(b2[:900]))
          print('=== MSP API por POST por si acaso ===')
          if api:
              d = urllib.parse.urlencode({'lang': '1'}).encode()
              st3, b3 = get(api, 'https://darkanimes.com/', data=d, extra={'Content-Type': 'application/x-www-form-urlencoded'})
              print('POST ->', st3, '|', repr(b3[:500]))
          PY
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe v29: resultados [skip ci]" || echo "nada"
          git push
