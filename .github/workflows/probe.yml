name: probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: sondear
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          R=probe-result.txt
          : > "$R"
          curl -sL --compressed -A "$UA" -H "Referer: https://veranime.ninja/" -w "HTTP %{http_code}\n" "https://veranime.ninja/wp-content/litespeed/js/13f2329fd2fa85b71525f300fa963573.js?ver=f622b" -o /tmp/main.js >> "$R" 2>&1
          python3 - <<'PY' >> "$R"
          import re, urllib.request, urllib.parse
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          js = open('/tmp/main.js', encoding='utf-8', errors='replace').read()
          print('bytes:', len(js))
          print('=== player_option (todos) ===')
          seen = set()
          for m in list(re.finditer(r'player_option', js)):
              i = m.start()
              k = i // 900
              if k in seen: continue
              seen.add(k)
              print('--- CTX:', repr(js[max(0,i-900):i+900]))
          print('=== player_api / dooplayer ===')
          seen2 = set()
          for m in list(re.finditer(r'player_api|dooplayer|play_ajaxmd|play_method', js)):
              i = m.start()
              k = i // 500
              if k in seen2: continue
              seen2.add(k)
              print('--- CTX:', repr(js[max(0,i-500):i+600]))
          PY
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe v27: resultados [skip ci]" || echo "nada"
          git push
