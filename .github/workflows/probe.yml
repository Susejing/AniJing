name: probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: sondear
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          R=probe-result.txt
          : > "$R"
          curl -sL --compressed -A "$UA" -H "Referer: https://veranime.ninja/" -w "HTTP %{http_code}\n" "https://veranime.ninja/ver/cyberpunk-edgerunners-episodio-1/" -o /tmp/ep.html >> "$R" 2>&1
          curl -sL --compressed -A "$UA" -H "Referer: https://ivanime.buzz/" -w "HTTP %{http_code}\n" "https://ivanime.buzz/ver/kanojo-no-tomodachi-episodio-6" -o /tmp/ivep6.html >> "$R" 2>&1
          curl -sL --compressed -A "$UA" -H "Referer: https://ivanime.buzz/" -w "HTTP %{http_code}\n" "https://ivanime.buzz/" -o /tmp/ivahome.html >> "$R" 2>&1
          python3 - <<'PY' >> "$R"
          import re, urllib.request, urllib.parse
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          def get(url, ref, data=None, extra=None):
              h = {'User-Agent': UA, 'Referer': ref, 'Accept': '*/*'}
              if extra: h.update(extra)
              req = urllib.request.Request(url, headers=h, data=data)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return 0, 'ERR ' + str(e)
          print('=== VAN: scripts del tema ===')
          ep = open('/tmp/ep.html', encoding='utf-8', errors='replace').read()
          srcs = []
          for m in re.finditer(r'(?:data-src|src)\s*=\s*["\']([^"\']+\.js[^"\']*)["\']', ep):
              u = m.group(1)
              if 'dooplay' in u or 'ajax' in u or 'main' in u or 'theme' in u:
                  if u not in srcs: srcs.append(u)
          for u in srcs[:8]:
              print('JS TEMA:', u)
          for u in srcs[:4]:
              st, b = get(u, 'https://veranime.ninja/')
              print('--- fetch', u, '->', st, 'len', len(b))
              if st == 200 and len(b) > 1000:
                  idxs = [m.start() for m in re.finditer(r'player_option|dooplay_player|admin-ajax|action\s*[:=]', b)][:10]
                  seen = set()
                  for i in idxs:
                      k = i // 400
                      if k in seen: continue
                      seen.add(k)
                      print('--- CTX:', repr(b[max(0,i-400):i+500]))
          print('=== IVA EP6: lista de episodios ===')
          ivep6 = open('/tmp/ivep6.html', encoding='utf-8', errors='replace').read()
          print('bytes:', len(ivep6))
          vers = []
          for m in re.finditer(r'href\s*=\s*["\']([^"\']*\/ver\/[^"\']+)["\']', ivep6):
              u = m.group(1)
              if u not in vers: vers.append(u)
          print('hrefs /ver/ en ep6:', len(vers))
          for u in vers[:25]:
              print('VER6:', u)
          if vers:
              i0 = min(m.start() for m in re.finditer(re.escape(vers[0]), ivep6))
              print('--- CTX LISTA:', repr(ivep6[max(0,i0-800):i0+800]))
          print('=== IVA HOME: tarjetas del listado ===')
          home = open('/tmp/ivahome.html', encoding='utf-8', errors='replace').read()
          animes = [m for m in re.finditer(r'href\s*=\s*["\'][^"\']*\/anime\/[^"\']+["\']', home)]
          print('anclas /anime/ totales:', len(animes))
          vistos = set()
          n = 0
          for m in animes:
              key = m.group(0)[:120]
              if key in vistos: continue
              vistos.add(key)
              i = m.start()
              ctx = home[max(0,i-800):i+400]
              if 'hero' in ctx and n > 2: continue
              print('--- CARD', n, ':', repr(home[max(0,i-700):i+600]))
              n += 1
              if n >= 3: break
          print('=== IVA SITEMAP ===')
          st, b = get('https://ivanime.buzz/sitemap.xml', 'https://ivanime.buzz/')
          print('sitemap ->', st, '| len:', len(b), '|', repr(b[:400]))
          PY
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe v25: resultados [skip ci]" || echo "nada"
          git push
