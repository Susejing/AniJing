name: sonde
on: push
permissions:
  contents: write
jobs:
  sonde:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sonda v55
        run: |
          mkdir -p sonda-out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          curl -sL --max-time 20 -A "$UA" 'https://www.az-animex.com/wp-json/wp/v2/posts?per_page=40&orderby=title&order=asc&page=1&_fields=slug,title,_links' -o /tmp/links.json || true
          IDS=$(jq -r '[.[]._links["wp:featuredmedia"][0].href / "media\/" as $u | ...] | join(",")' /tmp/links.json 2>/dev/null) || true
          IDS=$(jq -r '[.[]._links["wp:featuredmedia"][0].href | capture("(?<id>[0-9]+)$").id] | join(",")' /tmp/links.json) || true
          echo "IDS=$IDS" | head -c 300 > sonda-out/ids.txt || true
          if [ -n "$IDS" ]; then curl -sL --max-time 20 -A "$UA" "https://www.az-animex.com/wp-json/wp/v2/media?include=$IDS&per_page=40&_fields=id,source_url,media_details" -o sonda-out/api-media-inc.json || true; fi || true
          curl -sL --max-time 20 -A "$UA" 'https://www.az-animex.com/wp-json/wp/v2/media/63137?_fields=id,source_url,media_details' -o sonda-out/api-media-uno.json || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda out v55' || true
          git push
