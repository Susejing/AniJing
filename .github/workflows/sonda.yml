name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sondear
        run: |
          mkdir -p sonda-out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          # mp4 directo de peliculas.az-animex.com
          curl -s -o sonda-out/peliculas-head.txt -D sonda-out/peliculas-h.txt -A "$UA" -H 'Referer: https://www.az-animex.com/' -r 0-1023 --max-time 20 -w 'STATUS %{http_code} TYPE %{content_type} SIZE %{size_download}\n' 'https://peliculas.az-animex.com/B/Break%20Blade%201%20-%20Kakusei%20no%20Toki%20BD/%5BAz-Animex%5D%20Break%20Blade%201%20-%20Kakusei%20no%20Toki%20%5BBD%5D%5BDS%5D.mp4' || true
          # mp4 directo de onas.az-animex.com
          curl -s -o /dev/null -D sonda-out/onas-h.txt -A "$UA" -H 'Referer: https://www.az-animex.com/' -r 0-1023 --max-time 20 -w 'ONAS STATUS %{http_code} TYPE %{content_type} SIZE %{size_download}\n' 'https://onas.az-animex.com/es/B/Bubble/%5BAz-Animex%5D%20Bubble%20%5BHakoniwa%5D.mp4' || true
          # listado de series-am.az-animex.com (¿AList? ¿HTML?)
          curl -s -L -o sonda-out/seriesam-ajin.html -D sonda-out/seriesam-h.txt -A "$UA" -H 'Referer: https://www.az-animex.com/' --max-time 20 'https://series-am.az-animex.com/es/A/Ajin%20BD' || true
          # raiz de series-am por si la ruta larga no existe tal cual
          curl -s -L -o sonda-out/seriesam-raiz.html -A "$UA" --max-time 20 'https://series-am.az-animex.com/' || true
          # filemoon /f/ de AIR
          curl -s -L -o sonda-out/filemoon-f.html -A "$UA" --max-time 20 'https://filemoon.to/f/i2vnsvccef' || true
          # api de embed de ese mismo id
          curl -s -o sonda-out/filemoon-api.json -A "$UA" -H 'Referer: https://filemoon.to/f/i2vnsvccef' --max-time 20 'https://filemoon.to/api/videos/i2vnsvccef/embed/details' || true
          # filemoon /d/ de ai-wo-komete
          curl -s -L -o sonda-out/filemoon-d.html -A "$UA" --max-time 20 'https://filemoon.to/d/m90vqze7ym00' || true
          # api de ese id
          curl -s -o sonda-out/filemoon-api-d.json -A "$UA" --max-time 20 'https://filemoon.to/api/videos/m90vqze7ym00/embed/details' || true
          # carpeta de fireload (3-gatsu no lion)
          curl -s -L -o sonda-out/fireload-folder.html -A "$UA" --max-time 20 'https://www.fireload.com/folder/40917/3-gatsu_no_Lion_BD' || true
          # pagina de archivo suelto de fireload
          curl -s -L -o sonda-out/fireload-file.html -A "$UA" --max-time 20 'https://www.fireload.com/afc05582085b18ad/' || true
      - name: commit
        run: |
          git config user.name "sonda-bot"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out .github/workflows/sonda.yml
          git commit -m "sonda v57 out" || true
          git push || true
