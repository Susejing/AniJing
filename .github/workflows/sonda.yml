name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v71
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          prueba() {
            H="$1"; NOMBRE="$2"; URLC="https://www.fireload.com/folder/$H/$NOMBRE"
            echo "===== CARPETA $H ($NOMBRE) =====" >> sonda-out/v71-ajax.txt
            curl -s --max-time 20 -A "$UA" -c /tmp/cj "$URLC" -o /tmp/carpeta.html || true
            wc -c /tmp/carpeta.html >> sonda-out/v71-ajax.txt || true
            grep -o "id='url_hash'[^>]*" /tmp/carpeta.html >> sonda-out/v71-ajax.txt || true
            grep -o "id='nodeId'[^>]*" /tmp/carpeta.html >> sonda-out/v71-ajax.txt || true
            grep -o "id='rootfolderId'[^>]*" /tmp/carpeta.html >> sonda-out/v71-ajax.txt || true
            curl -s --max-time 20 -A "$UA" -e "$URLC" -b /tmp/cj \
              --data-urlencode "url_hash=$H" --data-urlencode "nodeId=-1" \
              --data-urlencode "filterText=" --data-urlencode "filterUploadedDateRange=" \
              --data-urlencode "filterOrderBy=order_by_filename_asc" \
              --data-urlencode "pageStart=0" --data-urlencode "perPage=100" \
              "https://www.fireload.com/ajax/_view_folder_v2_file_listing.ajax.php" | head -c 6000 >> sonda-out/v71-ajax.txt 2>&1 || true
            echo "" >> sonda-out/v71-ajax.txt
          }
          prueba 24361 "Amagami_SS%2B_Plus_BD"
          prueba 28771 "Asobi_ni_Iku_yo%21_BD"
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v71: ajax con id numérico" || true
          git push || true
