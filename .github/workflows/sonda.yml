name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sondear
        run: |
          mkdir -p sonda-out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          {
          echo '=== DNS ==='
          for h in peliculas.az-animex.com onas.az-animex.com series-am.az-animex.com especiales.az-animex.com dire.az-animex.com ovas.az-animex.com; do
            echo "-- $h"
            getent hosts "$h" || echo 'SIN DNS'
          done
          echo '=== PELICULAS mp4 (Range 0-1023) ==='
          curl -s -A "$UA" -H 'Referer: https://www.az-animex.com/' -r 0-1023 --max-time 20 -o sonda-out/peliculas-body.bin -D - -w 'STATUS %{http_code} TYPE %{content_type} SIZE %{size_download}\n' 'https://peliculas.az-animex.com/B/Break%20Blade%201%20-%20Kakusei%20no%20Toki%20BD/%5BAz-Animex%5D%20Break%20Blade%201%20-%20Kakusei%20no%20Toki%20%5BBD%5D%5BDS%5D.mp4' 2>&1 | head -40
          echo '=== ONAS mp4 (Range 0-1023) ==='
          curl -s -A "$UA" -H 'Referer: https://www.az-animex.com/' -r 0-1023 --max-time 20 -o /dev/null -D - -w 'STATUS %{http_code} TYPE %{content_type} SIZE %{size_download}\n' 'https://onas.az-animex.com/es/B/Bubble/%5BAz-Animex%5D%20Bubble%20%5BHakoniwa%5D.mp4' 2>&1 | head -30
          echo '=== SERIES-AM Ajin BD ==='
          curl -s -L -A "$UA" --max-time 20 -D - -o sonda-out/seriesam-ajin.txt -w 'STATUS %{http_code} TYPE %{content_type} SIZE %{size_download}\n' 'https://series-am.az-animex.com/es/A/Ajin%20BD' 2>&1 | head -30
          echo '=== SERIES-AM raiz ==='
          curl -s -L -A "$UA" --max-time 20 -D - -o sonda-out/seriesam-raiz.txt -w 'STATUS %{http_code} TYPE %{content_type} SIZE %{size_download}\n' 'https://series-am.az-animex.com/' 2>&1 | head -20
          } >> sonda-out/sonda-v58.txt 2>&1 || true
          # cuerpo de peliculas en texto por si trae mp4
          file sonda-out/peliculas-body.bin >> sonda-out/sonda-v58.txt 2>&1 || true
          head -c 200 sonda-out/peliculas-body.bin | tr -c '[:print:][:space:]' '.' >> sonda-out/sonda-v58.txt 2>&1 || true
          echo '' >> sonda-out/sonda-v58.txt || true
          rm -f sonda-out/peliculas-body.bin || true
      - name: commit
        run: |
          git config user.name "sonda-bot"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out .github/workflows/sonda.yml
          git commit -m "sonda v58 out" || true
          git push || true
