name: sonde
on: push
permissions:
  contents: write
jobs:
  sonde:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sonda v53
        run: |
          mkdir -p sonda-out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          curl -sL -A "$UA" -o sonda-out/ovas-head.txt -w 'HTTP %{http_code} | type %{content_type} | len %{size_download}\n' -r 0-2047 'https://ovas.az-animex.com/es/E/Eiyuu%20Kaitai%20BD/%5BAz-Animex%5D%20Eiyuu%20Kaitai%20%5BBD%5D%5BSunshine%5D.mp4' >> sonda-out/ovas-status.txt 2>&1
          curl -sIL -A "$UA" 'https://ovas.az-animex.com/es/E/Eiyuu%20Kaitai%20BD/%5BAz-Animex%5D%20Eiyuu%20Kaitai%20%5BBD%5D%5BSunshine%5D.mp4' | head -40 > sonda-out/ovas-head.txt
          curl -sL -A "$UA" 'https://www.az-animex.com/wp-json/wp/v2/posts?per_page=40&orderby=title&order=asc&page=1&_embed=wp:featuredmedia&_fields=slug,title' -o sonda-out/api-embed.json
          curl -sL -A "$UA" 'https://www.fireload.com/d8d11c1100af08b6/' -o sonda-out/fl-oyatsu.html
          curl -sL -A "$UA" 'https://www.fireload.com/afc05582085b18ad/' -o sonda-out/fl-movie.html
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda out v53' || true
          git push
