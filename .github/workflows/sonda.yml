name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v70
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          for slug in amagami-ss-plus asobi-ni-iku-yo anne-happy dagashi-kashi busou-shoujo-machiavellianism ben-to; do
            {
              echo "===== FICHA $slug ====="
              curl -s --max-time 20 -A "$UA" "https://www.az-animex.com/$slug/" -o /tmp/f.html || true
              wc -c /tmp/f.html || true
              grep -o 'href="[^"]*"' /tmp/f.html | grep -i -E "fireload|filemoon|mega|multiup|terabox|mediafire|mirrored" | sort -u || true
              echo "--- botones col1 ---"
              grep -o '<a class="[^"]*col1-boton[^"]*"[^>]*href="[^"]*"' /tmp/f.html || true
            } >> sonda-out/v70-fichas.txt 2>&1 || true
          done
          echo "===== AJAX carpeta de asobi (si hay hash en su ficha) =====" >> sonda-out/v70-fichas.txt
          H=$(grep -o 'fireload.com/folder/[a-f0-9]\{32\}' /tmp/f.html | head -1 | sed 's|fireload.com/folder/||' || true)
          echo "hash asobi: $H" >> sonda-out/v70-fichas.txt
          curl -s --max-time 20 -A "$UA" -e "https://www.fireload.com/" -c /tmp/cj -b /tmp/cj "https://www.fireload.com/folder/$H/" -o /dev/null || true
          curl -s --max-time 20 -A "$UA" -e "https://www.fireload.com/folder/$H/" -b /tmp/cj \
            -d "url_hash=$H" -d "nodeId=-1" -d "filterText=" -d "filterUploadedDateRange=" \
            -d "filterOrderBy=order_by_filename_asc" -d "pageStart=0" -d "perPage=100" \
            "https://www.fireload.com/ajax/_view_folder_v2_file_listing.ajax.php" | head -c 3000 >> sonda-out/v70-fichas.txt 2>&1 || true
          echo "" >> sonda-out/v70-fichas.txt
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v70: fichas y ajax" || true
          git push || true
