name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: v64
        run: |
          set -u
          mkdir -p sonda-out
          cd sonda-out
          UAW='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          FO='https://www.fireload.com/folder/cac87056363111ce9ca201f09123a025/Ano_Natsu_de_Matteru_BD'
          rm -f fl.jar fo.html
          curl -s -g -L -c fl.jar -A "$UAW" --max-time 20 "$FO" -o fo.html || true
          {
          echo "bytes: $(wc -c < fo.html 2>/dev/null || echo 0)"
          echo "== contexto de loadFiles =="
          grep -oE '.{0,160}loadFiles.{0,200}' fo.html | head -6 || true
          echo
          echo "== contexto de fileList =="
          grep -oE '.{0,120}fileList.{0,160}' fo.html | head -6 || true
          echo
          echo "== urls de ajax en la pagina =="
          grep -oE '(ajax|/assets/plugins/)[A-Za-z0-9/_.-]+' fo.html | sort | uniq -c | sort -rn | head -12 || true
          echo
          echo "== contexto de url: con json/ajax =="
          grep -oE 'url[^,;]{0,120}' fo.html | grep -iE 'ajax|json|folder|load' | head -8 || true
          } > v64-folder.txt 2>&1
          rm -f fo.html
          cd ..
          git config user.name 'sonda'
          git config user.email 'sonda@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda v64: ajax de carpetas fireload' || true
          git push || true
