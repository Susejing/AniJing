name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: v61
        run: |
          set -u
          mkdir -p sonda-out
          cd sonda-out
          UAW='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          UAM='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.6367.82 Mobile Safari/537.36'
          FL='https://www.fireload.com/afc05582085b18ad/[Az-Animex]_Bungaku_Shoujo_Movie_[BD][Osoku].mp4'
          rm -f w1.jar m1.jar r1.html r2.html r3.html p1.bin p2.bin p3.bin p4.bin p5.bin p6.bin
          {
          echo "== R1: UA Windows (el del plugin), jar FRESCO =="
          curl -s -g -L -c w1.jar -A "$UAW" -H 'Accept: text/html,application/xhtml+xml,*/*' -H 'Accept-Language: es-ES,es;q=0.9' --max-time 20 "$FL" -o r1.html || true
          echo "bytes: $(wc -c < r1.html 2>/dev/null || echo 0)"
          echo "window.Fl en r1: $(grep -c 'window\.Fl' r1.html || true)"
          echo "pt= en r1: $(grep -ohE 'pt=[A-Za-z0-9%=_-]+' r1.html | head -2 | tr '\n' ' ')"
          echo
          echo "== R2: UA Windows, jar CALENTADO (2a visita con la galleta filehosting) =="
          curl -s -g -L -b w1.jar -c w1.jar -A "$UAW" -H 'Accept: text/html,application/xhtml+xml,*/*' -H 'Accept-Language: es-ES,es;q=0.9' --max-time 20 "$FL" -o r2.html || true
          echo "bytes: $(wc -c < r2.html 2>/dev/null || echo 0)"
          echo "window.Fl en r2: $(grep -c 'window\.Fl' r2.html || true)"
          grep -o 'window\.Fl[^<]\{0,350\}' r2.html | head -2 || true
          echo
          echo "== R3: UA Android, jar calentado =="
          curl -s -g -L -c m1.jar -A "$UAM" --max-time 20 "$FL" -o /dev/null || true
          curl -s -g -L -b m1.jar -c m1.jar -A "$UAM" --max-time 20 "$FL" -o r3.html || true
          echo "bytes: $(wc -c < r3.html 2>/dev/null || echo 0)"
          echo "window.Fl en r3: $(grep -c 'window\.Fl' r3.html || true)"
          echo
          echo "== jar w1 tras R2 =="
          grep -v '^#' w1.jar | grep . || true
          echo
          D=$(grep -oh 'window\.Fl = {"dlink": "[^"]*"' r2.html 2>/dev/null | head -1 | sed 's/.*"dlink": "//; s/"$//' || true)
          if [ -z "$D" ]; then D=$(grep -ohE "https://www\.fireload\.com/[a-f0-9]{16}/[^\"[:space:]]+\\?pt=[A-Za-z0-9%=_-]+" r1.html r2.html r3.html 2>/dev/null | head -1 || true); fi
          echo "dlink elegido: [$D]"
          if [ -n "$D" ]; then
          echo
          echo "== P1: dlink CON cookies+UA+Referer (uso 1) =="
          curl -s -g -D - -b w1.jar -A "$UAW" -e 'https://www.fireload.com/' -r 0-1023 --max-time 20 "$D" -o p1.bin || true
          echo "bytes: $(wc -c < p1.bin 2>/dev/null || echo 0)"
          file p1.bin || true
          head -c 32 p1.bin | od -An -tx1 || true
          echo
          echo "== P2: dlink SIN cookies, con UA+Referer =="
          curl -s -g -D - -A "$UAW" -e 'https://www.fireload.com/' -r 0-1023 --max-time 20 "$D" -o p2.bin || true
          echo "bytes: $(wc -c < p2.bin 2>/dev/null || echo 0)"
          file p2.bin || true
          head -c 200 p2.bin || true
          echo
          echo "== P3: dlink SIN Referer, con cookies+UA =="
          curl -s -g -D - -b w1.jar -A "$UAW" -r 0-1023 --max-time 20 "$D" -o p3.bin || true
          echo "bytes: $(wc -c < p3.bin 2>/dev/null || echo 0)"
          file p3.bin || true
          echo
          echo "== P4: dlink con cookies+Referer pero UA de curl =="
          curl -s -g -D - -b w1.jar -e 'https://www.fireload.com/' -r 0-1023 --max-time 20 "$D" -o p4.bin || true
          echo "bytes: $(wc -c < p4.bin 2>/dev/null || echo 0)"
          file p4.bin || true
          echo
          echo "== P5: REUSO del dlink (2a peticion con todo) =="
          curl -s -g -D - -b w1.jar -A "$UAW" -e 'https://www.fireload.com/' -r 0-1023 --max-time 20 "$D" -o p5.bin || true
          echo "bytes: $(wc -c < p5.bin 2>/dev/null || echo 0)"
          file p5.bin || true
          echo
          echo "== P6: dlink con corchetes %5B/%5D, cookies+UA+Referer =="
          DE=$(printf '%s' "$D" | sed 's/\[/%5B/g; s/\]/%5D/g')
          curl -s -g -D - -b w1.jar -A "$UAW" -e 'https://www.fireload.com/' -r 0-1023 --max-time 20 "$DE" -o p6.bin || true
          echo "bytes: $(wc -c < p6.bin 2>/dev/null || echo 0)"
          file p6.bin || true
          fi
          } > v61-fireload.txt 2>&1
          rm -f r1.html r2.html r3.html p1.bin p2.bin p3.bin p4.bin p5.bin p6.bin
          cd ..
          git config user.name 'sonda'
          git config user.email 'sonda@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda v61: matriz del dlink de fireload' || true
          git push || true
