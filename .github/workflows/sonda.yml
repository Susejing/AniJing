name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: v62
        run: |
          set -u
          mkdir -p sonda-out
          cd sonda-out
          UAW='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          FL='https://www.fireload.com/afc05582085b18ad/[Az-Animex]_Bungaku_Shoujo_Movie_[BD][Osoku].mp4'
          rm -f w1.jar r1.html s1.hdr t1.bin t2.bin t3.bin t4.bin t5.hdr t6.bin
          {
          curl -s -g -L -c w1.jar -A "$UAW" -H 'Accept-Language: es-ES,es;q=0.9' --max-time 20 "$FL" -o r1.html || true
          D=$(grep -oh 'window\.Fl = {"dlink": "[^"]*"' r1.html | head -1 | sed 's/.*"dlink": "//; s/"$//' || true)
          echo "dlink: [$D]"
          curl -s -g -D s1.hdr -o /dev/null -b w1.jar -A "$UAW" -e 'https://www.fireload.com/' --max-time 20 "$D" || true
          S=$(grep -i "^location:" s1.hdr | head -1 | tr -d "\r" | sed "s/^[Ll]ocation: //")
          echo "srv4 bruto: [$S]"
          SE=$(printf '%s' "$S" | sed 's/\[/%5B/g; s/\]/%5D/g; s/ /%20/g')
          echo "srv4 codificado: [$SE]"
          if [ -n "$SE" ]; then
          echo
          echo "== T1: GET rango 0-1023 con UA+Referer+cookie (uso 1) =="
          curl -s -g -D - -b w1.jar -A "$UAW" -e 'https://www.fireload.com/' -r 0-1023 --max-time 20 "$SE" -o t1.bin || true
          echo "bytes: $(wc -c < t1.bin 2>/dev/null || echo 0)"
          file t1.bin || true
          head -c 32 t1.bin | od -An -tx1 || true
          echo
          echo "== T2: GET rango 1024-2047 (uso 2 del MISMO token) =="
          curl -s -g -D - -b w1.jar -A "$UAW" -e 'https://www.fireload.com/' -r 1024-2047 --max-time 20 "$SE" -o t2.bin || true
          echo "bytes: $(wc -c < t2.bin 2>/dev/null || echo 0)"
          file t2.bin || true
          echo
          echo "== T3: GET rango 0-1023 SIN cookie (UA+Referer) =="
          curl -s -g -D - -A "$UAW" -e 'https://www.fireload.com/' -r 0-1023 --max-time 20 "$SE" -o t3.bin || true
          echo "bytes: $(wc -c < t3.bin 2>/dev/null || echo 0)"
          file t3.bin || true
          echo
          echo "== T4: GET rango 0-1023 SIN Referer (cookie+UA) =="
          curl -s -g -D - -b w1.jar -A "$UAW" -r 0-1023 --max-time 20 "$SE" -o t4.bin || true
          echo "bytes: $(wc -c < t4.bin 2>/dev/null || echo 0)"
          file t4.bin || true
          echo
          echo "== T5: HEAD con todo =="
          curl -s -g -I -D - -b w1.jar -A "$UAW" -e 'https://www.fireload.com/' --max-time 20 "$SE" || true
          echo
          echo "== T6: GET rango 0-1023 pelado (sin UA, sin Referer, sin cookie) =="
          curl -s -g -D - -r 0-1023 --max-time 20 "$SE" -o t6.bin || true
          echo "bytes: $(wc -c < t6.bin 2>/dev/null || echo 0)"
          file t6.bin || true
          fi
          } > v62-srv4.txt 2>&1
          rm -f r1.html s1.hdr t1.bin t2.bin t3.bin t4.bin t5.hdr t6.bin
          cd ..
          git config user.name 'sonda'
          git config user.email 'sonda@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda v62: srv4 y download_token' || true
          git push || true
