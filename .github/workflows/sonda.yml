name: sonde
on: push
permissions:
  contents: write
jobs:
  sonde:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sonda v51e
        run: |
          mkdir -p sonda-out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          curl -sL -A "$UA" 'https://www.az-animex.com/wp-json/wp/v2/posts?per_page=20&orderby=title&order=asc&_embed=wp:featuredmedia&_fields=slug,title,_embedded%5B%22wp:featuredmedia%22%5D.source_url' -o sonda-out/api-embed-a.json
          curl -sL -A "$UA" 'https://www.az-animex.com/wp-json/wp/v2/posts?per_page=20&orderby=title&order=asc&_embed=wp:featuredmedia&_fields=slug,title,_embedded' -o sonda-out/api-embed-b.json
          wc -c sonda-out/api-embed-a.json sonda-out/api-embed-b.json >> sonda-out/api-embed-sizes.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda out v51e' || true
          git push
