name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: ${{ !startsWith(github.event.head_commit.message, '[sonda]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sondear
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
          R="sonda-out/v42-resumen.txt"
          b64url_d() {
            s=$(printf "%s" "$1" | tr "_-" "/+")
            m=$((${#s} % 4))
            if [ "$m" = "2" ]; then s="$s=="; elif [ "$m" = "3" ]; then s="$s="; fi
            printf "%s" "$s" | base64 -d 2>/dev/null || true
          }
          bajar() { curl -sL -A "$UA" -m 45 "$1" -o "$2" 2>/dev/null; echo "$2: $(wc -c < "$2" 2>/dev/null || echo 0) bytes"; }
          echo "SONDA V42" > $R
          echo "=== AZ ficha completa y estructura descargas ===" >> $R
          bajar "https://www.az-animex.com/oshi-no-ko/" azf.html >> $R
          echo "--- contexto mirrored.to:" >> $R
          grep -oE ".{0,350}mirrored.to[^\x22<> ]{0,80}" azf.html | head -3 >> $R || true
          echo "--- contexto dire.az-anime (acortador?):" >> $R
          grep -oE ".{0,200}dire\.az-anime.{0,200}" azf.html | head -2 >> $R || true
          echo "--- headers de version/episodios (no CSS):" >> $R
          grep -oE ".{0,80}(Episodio|Episodios|Versi&oacute;n|Versi&oacute|OVA|Pelicula|Pel&iacute;cula|Batch|Completo)[^<]{0,50}" azf.html | grep -viE "font|color|px|rgba|--|width|hover" | head -10 >> $R || true
          echo "--- estructura botones col1- (fuera de CSS):" >> $R
          grep -oE "class=\x22col1-[a-z]+\x22[^>]{0,120}" azf.html | head -8 >> $R || true
          grep -oE "<a[^>]{0,200}class=\x22[^"]*col1-[a-z]+[^"]*\x22[^>]{0,200}>[^<]{0,40}" azf.html | head -6 >> $R || true
          echo "=== AZ directorio: estructura entradas ===" >> $R
          bajar "https://www.az-animex.com/directorio-anime/" azd.html >> $R
          grep -oE ".{0,200}entradas-titulo.{0,300}" azd.html | head -2 >> $R || true
          echo "=== AZ home: estructura lcpag-card ===" >> $R
          bajar "https://www.az-animex.com/" azh.html >> $R
          grep -oE ".{0,100}lcpag-card.{0,450}" azh.html | head -2 >> $R || true
          echo "=== AZ mirrored.to multilinks ===" >> $R
          bajar "https://www.mirrored.to/multilinks/fe371ce9c1" azm.html >> $R
          echo "title: $(grep -oE "<title>[^<]*" azm.html | head -1)" >> $R
          grep -oE "<a [^>]{0,250}>(Download|Descargar)[^<]{0,20}" azm.html | head -12 >> $R || true
          grep -oE "href=\x22https?://[^\x22]{0,140}\x22" azm.html | grep -viE "mirrored.to|css|font|jquery|cdn|js" | head -12 >> $R || true
          echo "--- contexto nombre de archivo:" >> $R
          grep -oiE "(\.mkv|\.mp4|\.rar|\.zip)[^a-z][^\x22<>]{0,60}" azm.html | head -6 >> $R || true
          echo "=== DW ficha yomi: secciones idioma ===" >> $R
          bajar "https://dw-anime.net/yomi-no-tsugai-sub-latino-castellano/" dwf.html >> $R
          grep -oE ".{0,120}(Versi&oacute;n Subtitulada|Versi&oacute;n Latino|Versi&oacute;n Castellano|Subtitulada|Latino</|Castellano</).{0,120}" dwf.html | grep -viE "og:|description|twitter" | head -8 >> $R || true
          echo "--- contexto Capitulo 1 (tabla):" >> $R
          grep -oE ".{0,80}Capitulo 1</td>.{0,600}" dwf.html | head -1 >> $R || true
          echo "=== DW cadena completa (8 links, titulos de nube) ===" >> $R
          i=0
          for GOURL in $(grep -oE "https://paste.segurosdevida.site/linck/[?]go=[A-Za-z0-9_=-]+" dwf.html | head -8); do
            i=$((i+1))
            CAMA=$(b64url_d "${GOURL#*go=}" || true)
            CH=$(curl -sL -A "$UA" -m 35 "$CAMA" 2>/dev/null || true)
            SL=$(printf "%s" "$CH" | grep -oE "safelink_redirect=[A-Za-z0-9]+" | head -1)
            SJ=$(b64url_d "${SL#safelink_redirect=}" | tr -d "{}" | tr -d "\\")
            NUBE=$(printf "%s" "$SJ" | grep -oE "https://[a-zA-Z0-9./?_=-]+" | grep -iE "mediafire|mega|drive|1fichier|pixeldrain" | head -1)
            TIT="?"
            DL="-"
            if [ -n "$NUBE" ]; then
              NF=$(curl -sL -A "$UA" -m 35 "$NUBE" 2>/dev/null || true)
              printf "%s" "$NF" | head -c 40000 > "sonda-out/v42-nube-$i.html" || true
              TIT=$(printf "%s" "$NF" | grep -oE "<title>[^<]*" | head -1 | sed "s/<title>//")
              DL=$(printf "%s" "$NF" | grep -oE "https://download[0-9]+[^\x22<> ]+" | head -1)
            fi
            echo "link$i | nube: $NUBE | titulo: $TIT | dl: ${DL:0:90}" >> $R
          done
          echo "=== DW home cards ===" >> $R
          bajar "https://dw-anime.net/" dwh.html >> $R
          grep -oE "<article[^>]*>" dwh.html | head -3 >> $R || true
          grep -oE ".{0,80}(pulsegrid|card)[^"]*\x22.{0,300}" dwh.html | head -3 >> $R || true
          grep -oE "href=\x22https://dw-anime.net/[a-z0-9-]+/\x22" dwh.html | grep -vE "en-emision|generos|como-|vip" | sort -u | head -8 >> $R || true
          echo "=== DW emision estructura ===" >> $R
          bajar "https://dw-anime.net/en-emision/" dwe.html >> $R
          grep -oE "class=\x22[^\x22]*(calend|day|dia|week)[^\x22]*\x22" dwe.html | sort | uniq -c | sort -rn | head -8 >> $R || true
          grep -oE "href=\x22https://dw-anime.net/[a-z0-9-]+/\x22" dwe.html | grep -vE "en-emision|generos|como-|vip|tag/|category" | sort -u | head -10 >> $R || true
          echo "=== DW buscar naruto ===" >> $R
          bajar "https://dw-anime.net/?s=naruto" dwb.html >> $R
          echo "articles: $(grep -cE "<article" dwb.html || true)" >> $R
          grep -oE "<h[23][^>]*>[^<]{0,80}" dwb.html | head -8 >> $R || true
          echo "=== DW cats/tags ===" >> $R
          curl -sL -A "$UA" -m 30 "https://dw-anime.net/category-sitemap.xml" -o dwc.xml -w "cats %{http_code}\n" >> $R
          grep -oE "https://dw-anime.net/category/[a-z0-9-]+/" dwc.xml | head -14 >> $R || true
          curl -sL -A "$UA" -m 30 "https://dw-anime.net/post_tag-sitemap.xml" -o dwt.xml -w "tags %{http_code}\n" >> $R
          grep -oE "https://dw-anime.net/tag/[a-z0-9-]+/" dwt.xml | head -20 >> $R || true
          echo FIN >> $R
      - name: bitacora
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[sonda] log de fallo v42" --allow-empty
          git push
      - name: resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda-out
          git commit -m "[sonda] resultados v42" --allow-empty
          git push
