name: sonda
on: [push]
permissions:
  contents: write
jobs:
  sonda:
    if: ${{ !startsWith(github.event.head_commit.message, '[sonda]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sondear
        run: |
          cat > /tmp/sondea.sh <<'SONDA_EOF'
          #!/bin/bash
          set -u
          OUT="sonda-v39c-resultado.txt"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          > "$OUT"
          probe5() {
            local sitio="$1" url="$2" patron="$3" r code size lista
            r=$(curl -sL --max-time 25 -A "$UA" -H "Referer: $sitio/" -o /tmp/p.html -w "%{http_code} %{size_download}" "$url" 2>/dev/null || echo "ERR 0")
            code=$(echo "$r" | awk '{print $1}')
            size=$(echo "$r" | awk '{print $2}')
            lista=$(grep -oE 'href="[^"]*"' /tmp/p.html 2>/dev/null | sed 's/href="//;s/"$//' | grep -E "$patron" | grep -vE '(login|register|calendario|horario|feed)' | head -5 | tr '\n' ' | ' | cut -c1-420)
            echo "$url -> $code ${size}B | $lista" >> "$OUT"
          }
          # AnimeJara: mas generos + paginacion de genero
          probe5 https://animejara.com "https://animejara.com/genero/comedia" 'animejara\.com/anime/'
          probe5 https://animejara.com "https://animejara.com/genero/drama" 'animejara\.com/anime/'
          probe5 https://animejara.com "https://animejara.com/genero/fantasia" 'animejara\.com/anime/'
          probe5 https://animejara.com "https://animejara.com/genero/accion/page/2" 'animejara\.com/anime/'
          # MonosChinos: otro genero
          probe5 https://monoschinos.st "https://monoschinos.st/genero/comedia" 'monoschinos\.st/anime/'
          # LataAnime: mas generos
          probe5 https://latanime.org "https://latanime.org/genero/comedia" 'latanime\.org/anime/'
          probe5 https://latanime.org "https://latanime.org/genero/romance" 'latanime\.org/anime/'
          probe5 https://latanime.org "https://latanime.org/genero/accion?p=2" 'latanime\.org/anime/'
          # IvAnime: ?p en /animes + mas generos
          probe5 https://ivanime.buzz "https://ivanime.buzz/animes?p=2" 'ivanime\.buzz/anime/'
          probe5 https://ivanime.buzz "https://ivanime.buzz/animes?p=3" 'ivanime\.buzz/anime/'
          probe5 https://ivanime.buzz "https://ivanime.buzz/genero/comedia" 'ivanime\.buzz/anime/'
          probe5 https://ivanime.buzz "https://ivanime.buzz/genero/romance" 'ivanime\.buzz/anime/'
          probe5 https://ivanime.buzz "https://ivanime.buzz/genero/accion?p=2" 'ivanime\.buzz/anime/'
          # AnimeYT: paginacion de ranking/temporada + otro genero
          probe5 https://animeyt.cc "https://animeyt.cc/ranking/page/2/" 'animeyt\.cc/tv/'
          probe5 https://animeyt.cc "https://animeyt.cc/genero/comedia" 'animeyt\.cc/tv/'
          probe5 https://animeyt.cc "https://animeyt.cc/pelicula/page/2/" 'animeyt\.cc/pelicula/'
          # VerAnime: paginacion de peliculas
          probe5 https://veranime.ninja "https://veranime.ninja/pelicula/page/2/" 'veranime\.ninja/pelicula/'
          # EstrenosAnime: primeras tarjetas relativas
          probe5 https://estrenosanime.net "https://estrenosanime.net/tipo/OVA" '/anime/'
          probe5 https://estrenosanime.net "https://estrenosanime.net/estado/En+Emision" '/anime/'
          probe5 https://estrenosanime.net "https://estrenosanime.net/tipo/OVA/page/2/" '/anime/'
          SONDA_EOF
          bash /tmp/sondea.sh
          git config user.name "sonda-bot"
          git config user.email "actions@github.com"
          git add sonda-v39c-resultado.txt
          git commit -m "[sonda] resultados v39c"
          git push
