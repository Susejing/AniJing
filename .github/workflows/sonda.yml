name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v84
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== shadowrangers: rastros de nubes en la ficha cruda ====="
            curl -sL --max-time 25 -A "$UA" "https://shadowrangers.net/anime/bleach/" -o /tmp/sr.html || true
            grep -oiE 'mega|drive\.google|pixeldrain|fireload|terabox|mediafire|1fichier|gofile|streamtape|voe|filemoon|streamwish|dood|zippy|descarga|download|magnet|torrent' /tmp/sr.html | sort | uniq -c | sort -rn | head -15 || true
            echo "--- el post interno ?p=616 ---"
            curl -sL --max-time 25 -A "$UA" "https://shadowrangers.net/?p=616" -o /tmp/srp.html || true
            grep -oiE 'https?://[^"'"'"' <>]*(mega\.nz|drive\.google|pixeldrain|fireload|terabox|mediafire|1fichier|gofile|streamtape|voe\.|filemoon|streamwish|mp4upload|dood|uqload|mixdrop|zippy)[^"'"'"' <>]*' /tmp/srp.html | sort -u | head -15 || true
            grep -oE 'href="[^"]*"' /tmp/srp.html | grep -iE 'descarga|download|mega|drive|link' | sort -u | head -12 || true
            echo "===== sphinx: rastros de nubes en el post crudo ====="
            grep -oiE 'mega|drive\.google|pixeldrain|fireload|terabox|mediafire|1fichier|gofile|streamtape|voe|filemoon|streamwish|dood|zippy|magnet|torrent|acorta|shorte|ouo|adf\.ly|linkvertise' /tmp/sp.html | sort | uniq -c | sort -rn | head -15 || true
            echo "--- ¿enlaces en data- o JS? ---"
            grep -oE 'data-[a-z-]*link[^=]*="[^"]*"' /tmp/sp.html | sort -u | head -8 || true
            grep -oE '(var|window\.)[a-zA-Z_]*[Ll]ink[a-zA-Z_]*\s*=' /tmp/sp.html | sort -u | head -8 || true
          } > sonda-out/v84-rastros.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v84: rastros de nubes en crudo" || true
          git push || true
