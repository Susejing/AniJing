name: sonde
on: push
permissions:
  contents: write
jobs:
  sonde:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sonda v51
        run: |
          mkdir -p sonda-out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          curl -sL -A "$UA" -H 'Referer: https://www.az-animex.com/' 'https://www.az-animex.com/?s=grisaia' -o sonda-out/s-grisaia.html
          curl -sL -A "$UA" -H 'Referer: https://www.az-animex.com/' 'https://www.az-animex.com/?s=grisaia+no+kajitsu' -o sonda-out/s-kajitsu.html
          curl -sL -A "$UA" -H 'Referer: https://www.az-animex.com/' 'https://www.az-animex.com/?s=naruto' -o sonda-out/s-naruto.html
          curl -sL -A "$UA" -H 'Referer: https://www.az-animex.com/' 'https://www.az-animex.com/grisaia-no-kajitsu/' -o sonda-out/ficha-grisaia.html
          curl -sL -A "$UA" 'https://www.az-animex.com/sitemap.xml' -o sonda-out/sitemap.xml
          curl -sL -A "$UA" 'https://www.az-animex.com/wp-sitemap.xml' -o sonda-out/wp-sitemap.xml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda out v51' || true
          git push
