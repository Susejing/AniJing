name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v96
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== beatz: contexto tras anime-poster-link ====="
            curl -sL --max-time 25 -A "$UA" "https://www.beatz-anime.net/lista-animes/index.php" -o /tmp/la.html || true
            grep -oE 'anime-poster-link" href="/bd/[a-z0-9-]+\.html">.{0,400}' /tmp/la.html | head -3 || true
            echo "===== beatz: ficha bakemonogatari completa (head) ====="
            curl -sL --max-time 25 -A "$UA" "https://www.beatz-anime.net/bd/bakemonogatari.html" -o /tmp/bf.html || true
            grep -oE '<meta property="og:image" content="[^"]*"' /tmp/bf.html | head -2 || true
            grep -oE '<img[^>]*(poster|cover|bd)[^>]*>' /tmp/bf.html | head -4 || true
            echo "===== veranime: ¿otro dominio vivo? ====="
            for D in "https://veranime.ninja" "https://vanime.ninja" "https://veranime.tv"; do
              curl -sL --max-time 12 -A "$UA" -o /dev/null -w "$D -> %{http_code}\n" "$D/" || true
            done
          } > sonda-out/v96-beatz-img.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v96: imágenes del listado de beatz" || true
          git push || true
