name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sondear
        run: |
          mkdir -p sonda-out
          python3 << 'PYEOF'
          import json, re, html, urllib.request
          BASE = 'https://www.az-animex.com'
          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'}
          def get(u):
              try:
                  req = urllib.request.Request(u, headers=UA)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.read().decode('utf-8', 'replace')
              except Exception:
                  return ''
          # slugs de las primeras 5 paginas del A-Z
          slugs = []
          for p in range(1, 6):
              t = get(BASE + '/wp-json/wp/v2/posts?per_page=40&orderby=title&order=asc&page=' + str(p) + '&_fields=slug')
              try:
                  slugs += [x['slug'] for x in json.loads(t)]
              except Exception:
                  pass
          open('sonda-out/slugs.txt', 'w').write('\n'.join(slugs))
          # fichas crudas de los dos reclamados
          for s in ['air', 'amagami-ss']:
              open('sonda-out/f-' + s + '.html', 'w').write(get(BASE + '/' + s + '/'))
          def clasif(host, path):
              h = host.lower()
              if 'mirrored.to' in h: return 'mirrored'
              if 'rentry.co' in h: return 'rentry'
              if 'mediafire.com' in h: return 'mediafire'
              if 'fireload.com' in h: return 'fireload-' + ('d' if re.match(r'^/d', path) else ('folder' if re.match(r'^/folder', path) else 'otro'))
              if any(t in h for t in ['terabox', '4funbox', 'mirrobox', 'teraboxapp', '1024tera', 'freeterabox', 'gibitbox', 'momerybox', 'tibibox']): return 'terabox'
              if 'filemoon' in h: return 'filemoon-' + (path.split('/')[1] if len(path) > 1 and path.split('/')[1] else 'raiz')
              if 'dire.az-animex.com' in h: return 'serveraz-dire'
              if 'ovas.az-animex.com' in h: return 'serveraz-ovas'
              if 'multiup' in h: return 'multiup'
              if 'az-animex.com' in h: return 'az-otro'
              return 'otro:' + h
          censo = []
          for s in slugs:
              t = get(BASE + '/' + s + '/')
              botones = []
              for a in re.findall(r'<a[^>]*col1-boton[^>]*>', t):
                  m = re.search(r'href="([^"]+)"', a)
                  if not m: continue
                  u = html.unescape(m.group(1))
                  mm = re.match(r'https?://([^/]+)(/[^\?]*)?', u)
                  if mm:
                      botones.append({'c': clasif(mm.group(1), mm.group(2) or '/'), 'u': u[:180]})
                  else:
                      botones.append({'c': 'relativa', 'u': u[:180]})
              censo.append({'slug': s, 'n': len(botones), 'botones': botones})
          open('sonda-out/censo-v56.json', 'w').write(json.dumps(censo, ensure_ascii=False, indent=1))
          # resumen: conteo por mensajero y por combinacion
          cont = {}
          combos = {}
          for e in censo:
              claves = sorted(set(b['c'] for b in e['botones']))
              for b in e['botones']:
                  cont[b['c']] = cont.get(b['c'], 0) + 1
              if claves:
                  k = '+'.join(claves)
                  combos[k] = combos.get(k, 0) + 1
          resumen = {'fichas': len(censo), 'con_botones': sum(1 for e in censo if e['n']), 'por_mensajero': cont, 'por_combinacion': sorted(combos.items(), key=lambda kv: -kv[1])}
          open('sonda-out/censo-resumen-v56.json', 'w').write(json.dumps(resumen, ensure_ascii=False, indent=1))
          PYEOF
      - name: commit
        run: |
          git config user.name "sonda-bot" 
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out .github/workflows/sonda.yml
          git commit -m "sonda v56 out" || true
          git push || true
