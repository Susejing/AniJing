name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: inventario de mensajeros
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          : > sonda-out/generos.html
          for g in accion comedia romance drama seinen shounen fantasia; do
            for p in "" "/page/2/" "/page/3/"; do
              curl -sL --max-time 30 -A "$UA" "https://www.az-animex.com/genero/$g/$p" >> sonda-out/generos.html || true
            done
          done
          grep -oE 'https://www\.az-animex\.com/[a-z0-9-]+/' sonda-out/generos.html | sort -u | grep -vE '/(genero|directorio-anime|feed|tag|category|author|wp-|proyectos|tops)/' | head -220 > sonda-out/slugs.txt || true
          : > sonda-out/inventario.txt
          echo "FICHAS: $(wc -l < sonda-out/slugs.txt)" >> sonda-out/inventario.txt
          while read -r u; do
            s=$(basename "$u")
            h=$(curl -sL --max-time 25 -A "$UA" "$u") || true
            m=""
            if echo "$h" | grep -q "mirrored.to/multilinks/"; then m="$m,multilink"; fi
            if echo "$h" | grep -q "rentry.co/"; then m="$m,rentry"; fi
            if echo "$h" | grep -q "terabox.com/"; then m="$m,terabox"; fi
            if echo "$h" | grep -q "dire.az-animex.com/"; then m="$m,serveraz"; fi
            if echo "$h" | grep -q "mediafire.com/"; then m="$m,mediafire"; fi
            if echo "$h" | grep -q "multiup.org"; then m="$m,multiup"; fi
            if echo "$h" | grep -q "mega.nz"; then m="$m,mega"; fi
            echo "$s:$m" >> sonda-out/inventario.txt
          done < sonda-out/slugs.txt
          rm -f sonda-out/generos.html || true
      - name: ejemplos con hrefs
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          : > sonda-out/ejemplos.txt
          for s in bakemonogatari cossette-no-shouzou; do
            echo "== $s" >> sonda-out/ejemplos.txt
            curl -sL --max-time 25 -A "$UA" "https://www.az-animex.com/$s/" -o /tmp/f.html || true
            grep -oE 'href="https://(www\.)?(mediafire|multiup|terabox|rentry|mirrored|dire\.az-animex)[^"]*"' /tmp/f.html | sort -u | head -8 >> sonda-out/ejemplos.txt || echo "(nada)" >> sonda-out/ejemplos.txt
          done
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda-out
          git commit -m "sonda out" || true
          git push
