name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v90
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== tracker: browse.php ====="
            curl -sL --max-time 25 -A "$UA" "https://torrent.unionfansub.com/browse.php" -o /tmp/uft.html -w 'status %{http_code} bytes %{size_download}\n' || true
            grep -o '<title>[^<]*</title>' /tmp/uft.html | head -1 || true
            grep -oE 'href="[^"]*"' /tmp/uft.html | sort -u | head -20 || true
            grep -o 'iniciar sesión\|login\|registr\|Debes' /tmp/uft.html | sort | uniq -c | head -5 || true
            echo "--- ¿detalles de torrent? ---"
            TD=$(grep -oE 'details\.php\?id=[a-f0-9]+' /tmp/uft.html | head -1)
            echo "TD=$TD"
            if [ -n "$TD" ]; then
              curl -sL --max-time 20 -A "$UA" "https://torrent.unionfansub.com/$TD" -o /tmp/ufd.html || true
              grep -oE 'href="[^"]*"' /tmp/ufd.html | grep -iE 'download|magnet|\.torrent' | sort -u | head -8 || true
              grep -oiE '(mega\.nz|drive\.google|pixeldrain|gofile)[^"<> ]*' /tmp/ufd.html | sort -u | head -6 || true
            fi
            echo "===== archive: foro 3 (General) para ver el formato ====="
            curl -sL --max-time 20 -A "$UA" "https://foro.unionfansub.com/archive/index.php/forum-3.html" -o /tmp/ufa.html -w 'status %{http_code} bytes %{size_download}\n' || true
            grep -oE 'href="[^"]*thread-[^"]*"?>[^<]+' /tmp/ufa.html | head -10 || true
            grep -oE 'topic-[^"]*|tid-[0-9]+' /tmp/ufa.html | sort -u | head -10 || true
          } > sonda-out/v90-uf-tracker.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v90: tracker de UF sin cuenta" || true
          git push || true
