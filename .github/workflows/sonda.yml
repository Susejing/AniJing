name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bajar fichas
        run: |
          mkdir -p sonda-out
          for s in monogatari-series-second-season kimi-no-koto-ga-daidaidaidaidaisuki-na-100-nin-no-kanojo oshi-no-ko; do
            curl -sL --max-time 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36" "https://www.az-animex.com/$s/" -o "sonda-out/$s.html" || echo "fallo $s" >> sonda-out/bitacora.txt
            echo "== $s ==" >> sonda-out/greps.txt
            for p in "mirrored[^\"]*" "multilinks[^\"]*" "terabox[^\"]*" "dire\.az-animex[^\"]*" "admin-ajax" "col1-mirror" "getlink[^\"]*" "files/[A-F0-9]\{8\}" "tabs\|tab-" "data-link" "data-url"; do
              echo "-- $p:" >> sonda-out/greps.txt
              grep -oE "$p" "sonda-out/$s.html" | sort -u | head -15 >> sonda-out/greps.txt || echo "(nada)" >> sonda-out/greps.txt
            done
            wc -c "sonda-out/$s.html" >> sonda-out/bitacora.txt
          done
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda-out
          git commit -m "sonda out" || echo "nada que commitear"
          git push
