name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sondear
        run: |
          mkdir -p sonda-out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          curl -s -A "$UA" --max-time 30 -o sonda-out/filemoon-spa.js 'https://filemoon.to/assets/index-DocunfmE.js' || true
          curl -s -L -A "$UA" --max-time 20 -o sonda-out/terabox-air.html 'https://1024terabox.com/s/17ros2IqjamnOnfUMsQYh_A' || true
          {
          echo '=== API del bundle filemoon ==='
          grep -o 'api/[a-zA-Z0-9_./-]*' sonda-out/filemoon-spa.js 2>/dev/null | sort -u | head -40
          echo '=== tamanos ==='
          wc -c sonda-out/filemoon-spa.js sonda-out/terabox-air.html 2>/dev/null
          echo '=== terabox: locals / files ==='
          grep -o 'window.locals[^;][^;]\{0,150\}' sonda-out/terabox-air.html 2>/dev/null | head -3
          grep -o 'file_name[^,}][^,}]\{0,60\}' sonda-out/terabox-air.html 2>/dev/null | head -5
          grep -o 'dlink[^,}][^,}]\{0,100\}' sonda-out/terabox-air.html 2>/dev/null | head -5
          echo '=== terabox: title ==='
          grep -o '<title>[^<]*' sonda-out/terabox-air.html 2>/dev/null | head -2
          } > sonda-out/sonda-v59.txt 2>&1 || true
          rm -f sonda-out/filemoon-spa.js || true
      - name: commit
        run: |
          git config user.name "sonda-bot"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out .github/workflows/sonda.yml
          git commit -m "sonda v59 out" || true
          git push || true
