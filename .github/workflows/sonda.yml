name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: v67
        run: |
          set -u
          mkdir -p sonda-out
          cd sonda-out
          UAW='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          FO='https://www.fireload.com/folder/cac87056363111ce9ca201f09123a025/Ano_Natsu_de_Matteru_BD'
          rm -f fl.jar fo.html aj.html
          curl -s -g -L -c fl.jar -A "$UAW" --max-time 20 "$FO" -o fo.html || true
          {
          echo "== input con url_hash =="
          grep -oE "<input[^>]*url_hash[^>]*>" fo.html | head -4 || true
          echo
          echo "== input con nodeId =="
          grep -oE "<input[^>]*nodeId[^>]*>" fo.html | head -4 || true
          echo
          echo "== todos los input hidden =="
          grep -oE "<input[^>]*hidden[^>]*>" fo.html | head -10 || true
          } > v67-params.txt 2>&1
          UH=$(grep -oE '<input[^>]*url_hash[^>]*>' fo.html | grep -oE 'value="[^"]*"' | head -1 | sed 's/value="//; s/"$//' || true)
          NH=$(grep -oE '<input[^>]*id="nodeId"[^>]*>' fo.html | grep -oE 'value="[^"]*"' | head -1 | sed 's/value="//; s/"$//' || true)
          echo "url_hash=[$UH] nodeId=[$NH]" >> v67-params.txt
          if [ -n "$UH" ]; then
            curl -s -g -b fl.jar -A "$UAW" -e "$FO" --max-time 20 --data-urlencode "url_hash=$UH" --data-urlencode "nodeId=$NH" --data-urlencode "filterText=" --data-urlencode "filterUploadedDateRange=" --data-urlencode "filterOrderBy=default" --data-urlencode "pageStart=0" --data-urlencode "perPage=100" "https://www.fireload.com/ajax/_view_folder_v2_file_listing.ajax.php" -o aj.html || true
            echo "bytes aj.html: $(wc -c < aj.html 2>/dev/null || echo 0)" >> v67-params.txt
            echo "== enlaces de archivos =="
            grep -oE "https://www\.fireload\.com/[a-f0-9]{16}/[^\"<> ]{0,90}" aj.html | head -10 >> v67-params.txt || true
            grep -oE "id=\"rspTotalResults\" value=\"[^\"]*\"" aj.html >> v67-params.txt || true
          fi
          rm -f fo.html aj.html
          cd ..
          git config user.name 'sonda'
          git config user.email 'sonda@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda v67: los ocultos de la carpeta' || true
          git push || true
