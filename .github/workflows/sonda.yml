name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v81
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== shadowrangers: diagnóstico de la ficha ====="
            curl -sL --max-time 25 -A "$UA" -o /tmp/sr.html -w 'status %{http_code} bytes %{size_download}\n' "https://shadowrangers.net/anime/bleach/" || true
            grep -o '<title>[^<]*</title>' /tmp/sr.html | head -1 || true
            grep -oE 'href="https://shadowrangers\.net/[^"]*"' /tmp/sr.html | sort -u | head -25 || true
            echo "--- episode patterns ---"
            grep -oE 'href="[^"]*(episode|episodio|capitulo|/ver/)[^"]*"' /tmp/sr.html | sort -u | head -10 || true
            echo "--- ¿list-mode? ---"
            curl -sL --max-time 25 -A "$UA" -o /tmp/srl.html -w 'status %{http_code} bytes %{size_download}\n' "https://shadowrangers.net/anime/list-mode/" || true
            grep -oE 'href="https://shadowrangers\.net/anime/[^"]*"' /tmp/srl.html | sort -u | wc -l || true
            echo "===== kurosaki: diagnóstico ====="
            curl -sL --max-time 25 -A "$UA" -o /tmp/tk.html -w 'status %{http_code} bytes %{size_download}\n' "https://teamkurosaki.net/" || true
            grep -o '<title>[^<]*</title>' /tmp/tk.html | head -1 || true
            head -c 600 /tmp/tk.html || true
            echo ""
            grep -oE 'href="[^"]+"' /tmp/tk.html | sort -u | head -25 || true
            echo "===== sphinx: post BD con descargas ====="
            curl -sL --max-time 25 -A "$UA" -o /tmp/sp.html -w 'status %{http_code} bytes %{size_download}\n' "https://sphinxanime.com/all-you-need-is-kill-bd-1080p-latino-japones-26694/" || true
            grep -oiE 'https?://[^"'"'"' <>]*(mega\.nz|drive\.google|pixeldrain|fireload|terabox|streamtape|voe\.|filemoon|streamwish|mp4upload|dood|uqload|yourupload|mixdrop|ok\.ru|savefiles|lulustream|vidhide|byse|zippy|gofile|mediafire|1fichier)[^"'"'"' <>]*' /tmp/sp.html | sort -u | head -20 || true
            grep -o 'descarga\|Descargar\|contraseña' /tmp/sp.html | sort | uniq -c | head -6 || true
            echo "===== animegx vía espejo jina ====="
            curl -sL --max-time 40 -A "$UA" -o /tmp/gx.txt -w 'status %{http_code} bytes %{size_download}\n' "https://r.jina.ai/https://animegx.com/" || true
            head -c 1200 /tmp/gx.txt || true
            echo ""
            grep -oiE '(mega\.nz|drive\.google|pixeldrain|fireload|terabox|streamtape|voe|filemoon|streamwish|mp4upload|dood|uqload|yourupload|mixdrop|ok\.ru|savefiles|lulustream|vidhide|byse|zippy|gofile)' /tmp/gx.txt | sort | uniq -c | head -10 || true
          } > sonda-out/v81-diagnostico.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v81: diagnóstico de fichas y espejos" || true
          git push || true
