name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: v63
        run: |
          set -u
          mkdir -p sonda-out
          cd sonda-out
          UAW='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          UAM='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.6367.82 Mobile Safari/537.36'
          {
          for S in amagami-ss-plus arakawa-under-the-bridge d-frag aiura black-lagoon ano-natsu-de-matteru; do
            echo "===== ficha $S ====="
            curl -s -g -A "$UAW" -H "Accept-Language: es-ES,es;q=0.9" --max-time 20 "https://www.az-animex.com/$S/" -o f.html || true
            echo "bytes: $(wc -c < f.html 2>/dev/null || echo 0)"
            echo "botones fireload: $(grep -oE 'https://www\\.fireload\\.com/[A-Za-z0-9/_.-]+' f.html | sort -u | head -6 | tr '\n' ' ')"
            echo "botones todos: $(grep -oE 'href="https?://[^"]{10,90}"' f.html | grep -v 'az-animex\\|wp-\\|gravatar' | sort -u | head -8 | tr '\n' ' ')"
          done
          echo
          echo "===== busqueda grisaia (?s=) ====="
            curl -s -g -A "$UAW" --max-time 20 "https://www.az-animex.com/?s=grisaia" -o g.html || true
            echo "bytes: $(wc -c < g.html 2>/dev/null || echo 0)"
            grep -oE 'href="https://www\\.az-animex\\.com/[a-z0-9-]+/"' g.html | sort -u | head -12 || true
            echo
            echo "-- fichas grisaia: sus botones --"
            for GS in $(grep -oE "https://www\\.az-animex\\.com/[a-z0-9-]*grisaia[a-z0-9-]*/" g.html | sort -u | head -2); do
              echo "== $GS =="
              curl -s -g -A "$UAW" --max-time 20 "$GS" -o gs.html || true
              echo "fireload: $(grep -oE 'https://www\\.fireload\\.com/[A-Za-z0-9/_.-]+' gs.html | sort -u | head -4 | tr '\n' ' ')"
              echo "titulo: $(grep -oE '<title>[^<]*' gs.html | head -1)"
            done
          echo
          echo "===== carpeta de fireload (si alguna ficha trae /folder/) ====="
            FO=$(grep -ohE "https://www\\.fireload\\.com/folder/[A-Za-z0-9/_.-]+" f.html gs.html 2>/dev/null | head -1 || true)
            echo "folder: [$FO]"
            if [ -n "$FO" ]; then
              curl -s -g -L -c fl.jar -A "$UAW" --max-time 20 "$FO" -o fo.html || true
              echo "bytes folder: $(wc -c < fo.html 2>/dev/null || echo 0)"
              echo "archivos dentro: $(grep -oE 'https://www\\.fireload\\.com/[a-f0-9]{16}/[A-Za-z0-9/_.-]+' fo.html | sort -u | head -8 | tr '\n' ' ')"
              grep -oE 'loadFiles|fileList|ajax|getJSON|folder' fo.html | sort | uniq -c | head || true
            fi
          echo
          echo "===== terabox wap/outlogin (UA movil) ====="
            curl -s -g -L -D - -A "$UAM" -H "Accept-Language: es-419,es;q=0.9" --max-time 20 "https://www.terabox.com/wap/outlogin" -o w.html || true
            echo "bytes: $(wc -c < w.html 2>/dev/null || echo 0)"
            grep -oE 'type="password"|errno|rotate|dragdrop|Sign in|Log in|<title>[^<]*' w.html | sort | uniq -c | head || true
            head -c 200 w.html || true
          echo
          echo "===== terabox wap/outlogin (UA escritorio) ====="
            curl -s -g -L -D - -A "$UAW" --max-time 20 "https://www.terabox.com/wap/outlogin" -o w2.html || true
            echo "bytes: $(wc -c < w2.html 2>/dev/null || echo 0)"
            grep -oE 'type="password"|errno|rotate|dragdrop|<title>[^<]*' w2.html | sort | uniq -c | head || true
          echo
          echo "===== terabox /spanish/login con UA movil (que vio el telefono) ====="
            curl -s -g -L -D - -A "$UAM" --max-time 20 "https://www.terabox.com/spanish/login" -o w3.html || true
            echo "bytes: $(wc -c < w3.html 2>/dev/null || echo 0)"
            grep -oE 'Error\(404\)|type="password"|errno|<title>[^<]*' w3.html | sort | uniq -c | head || true
          } > v63-sondeo.txt 2>&1
          rm -f f.html g.html gs.html fo.html w.html w2.html w3.html fl.jar
          cd ..
          git config user.name 'sonda'
          git config user.email 'sonda@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda v63: muros fireload, grisaia, login terabox wap' || true
          git push || true
