name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v75
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== BEATZ ficha: menciones de nubes en crudo ====="
            curl -sL --max-time 25 -A "$UA" "https://www.beatz-anime.net/bd/bakemonogatari.html" -o /tmp/bf.html || true
            grep -o -i 'mega[^"'"'"'<> ]*' /tmp/bf.html | sort -u | head -15 || echo "sin mega"
            grep -o -i 'drive\.google[^"'"'"'<> ]*' /tmp/bf.html | sort -u | head -10 || echo "sin drive"
            grep -o -i 'fireload[^"'"'"'<> ]*' /tmp/bf.html | sort -u | head -10 || echo "sin fireload"
            grep -o -i 'terabox[^"'"'"'<> ]*' /tmp/bf.html | sort -u | head -10 || echo "sin terabox"
            echo "--- scripts de la ficha ---"
            grep -o '<script[^>]*src="[^"]*"' /tmp/bf.html | head -10 || true
            echo "--- botones/descarga en crudo ---"
            grep -o -i 'descarg[a-z]*[^<]\{0,80\}' /tmp/bf.html | head -15 || true
            echo "--- fetch/ajax en el js inline ---"
            grep -o -i 'fetch([^)]\{0,90\}' /tmp/bf.html | head -10 || true
            grep -o -i 'XMLHttpRequest\|\.ajax\|axios[^)]\{0,60\}' /tmp/bf.html | head -5 || true
            echo "===== UNION FANSUB: títulos de foros ====="
            curl -sL --max-time 25 -A "$UA" "https://foro.unionfansub.com/index.php" -o /tmp/uf.html || true
            grep -o 'forumdisplay.php?fid=[0-9]*"[^>]*>[^<]*' /tmp/uf.html | sed 's/"/ | /;s/">/ | /' | head -30 || true
          } > sonda-out/v75-nubes.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v75: nubes de beatz y foros unionfansub" || true
          git push || true
