name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: v68
        run: |
          set -u
          mkdir -p sonda-out
          cd sonda-out
          UAW='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          FO='https://www.fireload.com/folder/cac87056363111ce9ca201f09123a025/Ano_Natsu_de_Matteru_BD'
          rm -f fl.jar aj.html
          curl -s -g -L -c fl.jar -A "$UAW" --max-time 20 "$FO" -o /dev/null || true
          curl -s -g -b fl.jar -A "$UAW" -e "$FO" --max-time 20 --data-urlencode "url_hash=cac87056363111ce9ca201f09123a025" --data-urlencode "nodeId=-1" --data-urlencode "filterText=" --data-urlencode "filterUploadedDateRange=" --data-urlencode "filterOrderBy=order_by_filename_asc" --data-urlencode "pageStart=0" --data-urlencode "perPage=100" "https://www.fireload.com/ajax/_view_folder_v2_file_listing.ajax.php" -o aj.html || true
          {
          echo "bytes: $(wc -c < aj.html 2>/dev/null || echo 0)"
          echo "== enlaces de archivos =="
          grep -oE "https://www\.fireload\.com/[a-f0-9]{16}/[^\"<> ]{0,100}" aj.html | sort -u | head -12 || true
          echo
          echo "== totales =="
          grep -oE "id='rspTotalResults' value='[^']*'" aj.html | head -2 || true
          grep -oE "id='rspFolderTotalFiles' value='[^']*'" aj.html | head -2 || true
          echo
          echo "== nombre de archivo de muestra (data attributes) =="
          grep -oE "data-filename=.[^>]{0,80}" aj.html | head -4 || true
          grep -oE "rel=.[^>]{0,60}\.mp4" aj.html | head -4 || true
          } > v68-listado.txt 2>&1
          rm -f aj.html
          cd ..
          git config user.name 'sonda'
          git config user.email 'sonda@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda v68: listado con parametros exactos' || true
          git push || true
