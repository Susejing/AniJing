name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: ${{ !startsWith(github.event.head_commit.message, '[sonda]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sondear
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
          R="sonda-out/v43-resumen.txt"
          bajar() { curl -sL -A "$UA" -m 45 "$1" -o "$2" 2>/dev/null; echo "$2: $(wc -c < "$2" 2>/dev/null || echo 0)" >> $R; }
          echo "SONDA V43" > $R
          echo "=== 1. multilink crudo ===" >> $R
          bajar "https://www.mirrored.to/multilinks/fe371ce9c1" ml.html
          grep -oE "href=\x22[^\x22]*files/[A-F0-9]+/[^\x22]*\x22" ml.html | head -4 >> $R || true
          echo "=== 2. files _links ===" >> $R
          bajar "https://www.mirrored.to/files/F38E5A6B/[Az-Animex]_Oshi_no_Ko_-_01_[BD][Kashikoi].mp4_links" fl.html
          grep -oE "https://www.mirrored.to/files/F38E5A6B/[^\x22]*hash=[^\x22]*" fl.html | head -3 >> $R || true
          HASHURL=$(grep -oE "https://www.mirrored.to/files/F38E5A6B/[^\x22]*hash=[^\x22]*" fl.html | head -1)
          echo "=== 3. hash page hosts ===" >> $R
          bajar "$HASHURL" hp.html
          grep -oE "getlink/[A-F0-9]+/[0-9]+/[^\x22]*" hp.html | head -14 >> $R || true
          grep -oE "images/hosts/[A-Za-z]+\x22" hp.html | head -14 >> $R || true
          echo "=== 4. getlink redirects ===" >> $R
          GL=$(grep -oE "https://www.mirrored.to/getlink/F38E5A6B/156/[^\x22 ]*" hp.html | head -1)
          echo "voe-url: $GL" >> $R
          curl -sL -A "$UA" -m 40 -o gl1.html -w "voe: %{http_code} %{url_effective}\n" "$GL" >> $R 2>/dev/null || true
          grep -oE "<title>[^<]*" gl1.html | head -1 >> $R || true
          GL2=$(grep -oE "https://www.mirrored.to/getlink/F38E5A6B/149/[^\x22 ]*" hp.html | head -1)
          curl -sL -A "$UA" -m 40 -o gl2.html -w "tape: %{http_code} %{url_effective}\n" "$GL2" >> $R 2>/dev/null || true
          grep -oE "<title>[^<]*" gl2.html | head -1 >> $R || true
          echo "=== 5. az home cards ===" >> $R
          bajar "https://www.az-animex.com/" azh.html
          grep -oE "<article class=\x22lcpag-item lcpag-card\x22>.{0,950}" azh.html | head -2 >> $R || true
          echo "=== 6. az directorio entradas ===" >> $R
          bajar "https://www.az-animex.com/directorio-anime/" azd.html
          grep -oE "<h2 class=\x22entradas-titulo[^\x22]*\x22[^>]*>.{0,750}" azd.html | head -2 >> $R || true
          echo "=== 7. az buscar ===" >> $R
          bajar "https://www.az-animex.com/?s=naruto" azb.html
          grep -oE "entradas-titulo[^\x22]*\x22[^>]*>.{0,650}" azb.html | head -2 >> $R || true
          echo "=== 8. az genero accion ===" >> $R
          bajar "https://www.az-animex.com/genero/accion/" azga.html
          grep -oE "entradas-titulo[^\x22]*\x22[^>]*>.{0,650}" azga.html | head -2 >> $R || true
          grep -oE "href=\x22[^\x22]*/genero/accion/page/[0-9]+/\x22" azga.html | head -3 >> $R || true
          echo "=== 9. az genero accion pag 2 ===" >> $R
          bajar "https://www.az-animex.com/genero/accion/page/2/" azga2.html
          echo "entradas: $(grep -c entradas-titulo azga2.html || true)" >> $R
          echo "=== 10. az ficha estructura ===" >> $R
          bajar "https://www.az-animex.com/oshi-no-ko/" azf.html
          grep -oE "<h1[^>]*>[^<]{0,120}" azf.html | head -2 >> $R || true
          grep -oE "property=\x22og:image\x22 content=\x22[^\x22]*\x22" azf.html | head -1 >> $R || true
          grep -oE "href=\x22https://www.az-animex.com/genero/[a-z0-9-]+/\x22[^>]*>" azf.html | sort -u | head -10 >> $R || true
          grep -oE "multilinks/[a-f0-9]+" azf.html | sort -u | head -5 >> $R || true
          grep -oE ".{300}col1-mirror.{120}" azf.html | head -1 >> $R || true
          grep -oE "class=\x22col1-topspan\x22>[^<]{0,60}" azf.html | head -4 >> $R || true
          echo FIN >> $R
      - name: bitacora
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[sonda] log de fallo v43" --allow-empty
          git push
      - name: resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda-out
          git commit -m "[sonda] resultados v43" --allow-empty
          git push
