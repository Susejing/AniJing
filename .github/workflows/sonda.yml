name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v91
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== nyaa.si portada ====="
            curl -sL --max-time 25 -A "$UA" "https://nyaa.si/" -o /tmp/ny.html -w 'status %{http_code} bytes %{size_download}\n' || true
            grep -o '<title>[^<]*</title>' /tmp/ny.html | head -1 || true
            grep -c 'href="/view/' /tmp/ny.html || true
            echo "===== nyaa RSS API ====="
            curl -sL --max-time 25 -A "$UA" "https://nyaa.si/?page=rss&q=bakemonogatari&f=0&c=0_0" -o /tmp/nyr.xml -w 'status %{http_code} bytes %{size_download}\n' || true
            grep -oE '<title>[^<]{3,90}' /tmp/nyr.xml | head -6 || true
            grep -oE '<link>[^<]+' /tmp/nyr.xml | head -4 || true
            echo "===== una ficha /view: ¿DDL en la descripción? ====="
            VID=$(grep -oE '/view/[0-9]+' /tmp/ny.html | head -1)
            echo "VID=$VID"
            if [ -n "$VID" ]; then
              curl -sL --max-time 25 -A "$UA" "https://nyaa.si$VID" -o /tmp/nyv.html || true
              grep -oiE 'https?://[^"'"'"' <>]*(mega\.nz|drive\.google|pixeldrain|gofile|krakenfiles|1fichier|mediafire|zippy|terabox|fireload|streamtape|voe\.|filemoon|streamwish|dood|mp4upload|uqload|mixdrop)[^"'"'"' <>]*' /tmp/nyv.html | sort -u | head -12 || true
              echo "--- ¿descarga torrent sin cuenta? ---"
              grep -oE 'href="[^"]*(download|\.torrent)[^"]*"' /tmp/nyv.html | sort -u | head -4 || true
              grep -o 'magnet:' /tmp/nyv.html | head -2 || true
            fi
            echo "===== espejos ====="
            for M in "https://nyaa.iss.one/" "https://nyaa.land/"; do
              echo "--- $M ---"
              curl -sL --max-time 15 -A "$UA" -o /tmp/nym.html -w 'status %{http_code} bytes %{size_download}\n' "$M" || true
              grep -o '<title>[^<]*</title>' /tmp/nym.html | head -1 || true
            done
          } > sonda-out/v91-nyaa.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v91: nyaa.si y espejos" || true
          git push || true
