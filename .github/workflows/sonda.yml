name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bajar paste
        run: |
          curl -sL --max-time 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36" "https://rentry.co/nrswi84q" -o sonda-out/rentry-monogatari.html || echo fallo-rentry >> sonda-out/bitacora2.txt
          for p in "href=\\"[^\\"]*\\"\|https?://[^\\"< ]*"; do echo "-- $p:" >> sonda-out/greps2.txt; grep -oE "$p" sonda-out/rentry-monogatari.html | sort -u | head -40 >> sonda-out/greps2.txt || echo "(nada)" >> sonda-out/greps2.txt; done
          wc -c sonda-out/rentry-monogatari.html >> sonda-out/bitacora2.txt
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda-out
          git commit -m "sonda out" || echo "nada"
          git push
