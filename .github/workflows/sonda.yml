name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v93
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== av1: catálogo completo y paginación ====="
            curl -sL --max-time 25 -A "$UA" "https://animeav1.com/catalogo" -o /tmp/a1.html || true
            grep -oE '"totalPages":[0-9]+|"currentPage":[0-9]+|"perPage":[0-9]+' /tmp/a1.html | sort -u | head -6 || true
            grep -oE 'href="/catalogo\?[^"]*"' /tmp/a1.html | sort -u | head -12 || true
            echo "--- géneros del filtro ---"
            grep -oE '(genero|genre)[=/][a-z0-9-]+' /tmp/a1.html | sort -u | head -30 || true
            echo "--- ¿estado/tipo? ---"
            grep -oE '(estado|tipo|categoria)[=/][a-z0-9-]+' /tmp/a1.html | sort -u | head -15 || true
            echo "===== eas: rutas de directorio ====="
            for P in "/animes" "/anime" "/directorio" "/lista-anime" "/series" "/animes-lista"; do
              C=$(curl -sL --max-time 15 -A "$UA" -o /tmp/e.html -w '%{http_code}' "https://www.estrenosanime.net$P" || true)
              echo "  $P -> $C ($(wc -c < /tmp/e.html 2>/dev/null || echo 0) bytes)"
            done
            echo "===== mc: películas y profundidad del directorio ====="
            for P in "/peliculas" "/pelicula" "/animes?p=10" "/animes?p=30"; do
              C=$(curl -sL --max-time 15 -A "$UA" -o /tmp/m.html -w '%{http_code}' "https://monoschinos.st$P" || true)
              T=$(grep -coE 'class="[^"]*(card|item|anime)[^"]*"' /tmp/m.html 2>/dev/null || echo 0)
              echo "  $P -> $C ($T clases)"
            done
          } > sonda-out/v93-catalogos.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v93: catálogo completo av1, eas, mc" || true
          git push || true
