name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mediafire directo
        run: |
          mkdir -p sonda-out
          : > sonda-out/mf-directo.txt
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          echo "== pagina /file/ (tamanio):" >> sonda-out/mf-directo.txt
          curl -sL --max-time 30 -A "$UA" "https://www.mediafire.com/file/mi218yjanhmkbth/%255BAz-Animex%255D_Bakemonogatari_-_01_%255BBD%255D%255B%25C3%2591-RadioG%255D.mp4/file" -o /tmp/mf2.html && wc -c < /tmp/mf2.html >> sonda-out/mf-directo.txt || true
          echo "-- download####.mediafire.com:" >> sonda-out/mf-directo.txt
          grep -oE 'https://download[a-z0-9]*\.mediafire\.com/[^"<> ]*' /tmp/mf2.html | sort -u | head -5 >> sonda-out/mf-directo.txt || echo "(nada)" >> sonda-out/mf-directo.txt
          echo "-- hrefs con download:" >> sonda-out/mf-directo.txt
          grep -oE 'href="[^"]*download[^"]*"' /tmp/mf2.html | sort -u | head -8 >> sonda-out/mf-directo.txt || echo "(nada)" >> sonda-out/mf-directo.txt
      - name: fireload estructura
        run: |
          : > sonda-out/fireload2.txt
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sL --max-time 30 -A "$UA" "https://www.fireload.com/folder/4fbe306e2d5a7dd4fe235763e8a495a2/Kimi_wa_Houkago_Insomnia_BD" -o /tmp/fl.html || true
          echo "== todos los href fireload:" >> sonda-out/fireload2.txt
          grep -oE 'href="https://www\.fireload\.com[^"]*"' /tmp/fl.html | sort -u | head -20 >> sonda-out/fireload2.txt || echo "(nada)" >> sonda-out/fireload2.txt
          echo "== mp4 en la pagina:" >> sonda-out/fireload2.txt
          grep -oE '[A-Za-z0-9_ .()\[\]-]{0,60}\.mp4' /tmp/fl.html | sort -u | head -8 >> sonda-out/fireload2.txt || echo "(nada)" >> sonda-out/fireload2.txt
      - name: multiup estructura
        run: |
          : > sonda-out/multiup2.txt
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sL --max-time 30 -A "$UA" "https://multiup.io/en/project/2d5bb8039e78b31e01a1bac884d2669c" -o /tmp/mu.html || true
          echo "== hrefs con a/ o download:" >> sonda-out/multiup2.txt
          grep -oE 'href="[^"]*(/a/|download|mirror)[^"]*"' /tmp/mu.html | sort -u | head -15 >> sonda-out/multiup2.txt || echo "(nada)" >> sonda-out/multiup2.txt
      - name: vinland ficha
        run: |
          : > sonda-out/vinland.txt
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sL --max-time 30 -A "$UA" "https://www.az-animex.com/vinland-saga-season-2/" -o /tmp/v.html || true
          echo "== contexto filemoon:" >> sonda-out/vinland.txt
          grep -oE '.{0,120}filemoon[^"<>]{0,80}' /tmp/v.html | head -6 >> sonda-out/vinland.txt || echo "(nada)" >> sonda-out/vinland.txt
          echo "== contexto fireload:" >> sonda-out/vinland.txt
          grep -oE '.{0,120}fireload[^"<>]{0,80}' /tmp/v.html | head -6 >> sonda-out/vinland.txt || echo "(nada)" >> sonda-out/vinland.txt
          echo "== epoca de la ficha (fecha):" >> sonda-out/vinland.txt
          grep -oE '[0-9]{2}/[0-9]{2}/[0-9]{4}' /tmp/v.html | head -3 >> sonda-out/vinland.txt || true
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda-out
          git commit -m "sonda out" || true
          git push
