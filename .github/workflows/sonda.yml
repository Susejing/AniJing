name: sonde
on: push
permissions:
  contents: write
jobs:
  sonde:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sonda v51c
        run: |
          mkdir -p sonda-out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          curl -sL -A "$UA" 'https://www.az-animex.com/wp-json/wp/v2/posts?per_page=5&_fields=id,slug,title' -o sonda-out/api-posts.json
          curl -sL -A "$UA" 'https://www.az-animex.com/wp-json/wp/v2/types' -o sonda-out/api-types.json
          curl -sL -A "$UA" 'https://www.az-animex.com/wp-json/wp/v2/categories?per_page=5' -o sonda-out/api-cats.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda out v51c' || true
          git push
