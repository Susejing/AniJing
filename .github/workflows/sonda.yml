name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v85
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== shadowrangers: contexto de mega y Descarga ====="
            curl -sL --max-time 25 -A "$UA" "https://shadowrangers.net/anime/bleach/" -o /tmp/sr.html || true
            grep -oiE '.{100}mega.{160}' /tmp/sr.html | head -6 || true
            echo "--- Descarga ---"
            grep -oiE '.{80}Descarga.{200}' /tmp/sr.html | head -5 || true
            echo "--- voe ---"
            grep -oiE '.{100}voe.{160}' /tmp/sr.html | head -3 || true
            echo "===== sphinx: rastros en el post crudo ====="
            curl -sL --max-time 25 -A "$UA" "https://sphinxanime.com/all-you-need-is-kill-bd-1080p-latino-japones-26694/" -o /tmp/sp.html || true
            grep -oiE 'mega|drive\.google|pixeldrain|mediafire|1fichier|gofile|magnet|torrent|acorta|shorte|ouo\.io|linkvertise|mega\.nz' /tmp/sp.html | sort | uniq -c | sort -rn | head -12 || true
            echo "--- contexto del primer mega o acortador ---"
            grep -oiE '.{100}(mega|acorta|ouo|linkvertise).{200}' /tmp/sp.html | head -5 || true
          } > sonda-out/v85-contexto.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v85: contexto de mega y descargas" || true
          git push || true
