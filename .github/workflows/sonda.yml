name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v72
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== GET directo con headers ====="
            curl -s --max-time 25 -A "$UA" -D /tmp/h1.txt "https://www.fireload.com/folder/24361/Amagami_SS%2B_Plus_BD" -o /tmp/c1.html || true
            cat /tmp/h1.txt | head -20
            echo "bytes: $(wc -c < /tmp/c1.html)"
            grep -o "id='url_hash'[^>]*" /tmp/c1.html || grep -o 'id="url_hash"[^>]*' /tmp/c1.html || true
            grep -o "url_hash[^,}\"']*" /tmp/c1.html | head -5 || true
            echo "===== GET con -L y galletas ====="
            curl -sL --max-time 25 -A "$UA" -c /tmp/cj2 -b /tmp/cj2 -D /tmp/h2.txt "https://www.fireload.com/folder/24361/Amagami_SS%2B_Plus_BD" -o /tmp/c2.html || true
            head -12 /tmp/h2.txt
            echo "bytes: $(wc -c < /tmp/c2.html)"
            grep -o "id='url_hash'[^>]*" /tmp/c2.html || grep -o 'id="url_hash"[^>]*' /tmp/c2.html || true
            grep -o "id='nodeId'[^>]*" /tmp/c2.html || true
            grep -o "id='rootfolderId'[^>]*" /tmp/c2.html || true
            echo "===== primeros 1200 chars ====="
            head -c 1200 /tmp/c2.html || true
            echo ""
          } > sonda-out/v72-carpeta.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v72: página de carpeta con id numérico" || true
          git push || true
