name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v78
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== /api/fs/list de la carpeta de la serie ====="
            curl -sL --max-time 25 -A "$UA" -X POST "https://bz.beatz-anime.net/api/fs/list" -H "Content-Type: application/json" -d '{"path":"/BeatZ-Anime/Anime/Bakemonogatari","page":1,"per_page":100,"refresh":false}' | head -c 2500 || true
            echo ""
            echo "===== /api/fs/get del episodio 01 ====="
            curl -sL --max-time 25 -A "$UA" -X POST "https://bz.beatz-anime.net/api/fs/get" -H "Content-Type: application/json" -d '{"path":"/BeatZ-Anime/Anime/Bakemonogatari/[BeatZ-Anime] Bakemonogatari - 01 [BDRip 1080p HEVC-10bits FLAC].mkv"}' | head -c 2000 || true
            echo ""
            echo "===== GET (no HEAD) del /d/ episodio 01, primeros bytes ====="
            curl -sL --max-time 30 -A "$UA" -r 0-99 -o /tmp/chunk.bin -D - "https://bz.beatz-anime.net/d/BeatZ-Anime/Anime/Bakemonogatari/%5BBeatZ-Anime%5D%20Bakemonogatari%20-%2001%20%5BBDRip%201080p%20HEVC-10bits%20FLAC%5D.mkv" | head -25 || true
            file /tmp/chunk.bin || true
            echo "===== raíz del OpenList: /api/fs/list de /BeatZ-Anime/Anime (cuántas series) ====="
            curl -sL --max-time 25 -A "$UA" -X POST "https://bz.beatz-anime.net/api/fs/list" -H "Content-Type: application/json" -d '{"path":"/BeatZ-Anime/Anime","page":1,"per_page":300,"refresh":false}' | head -c 800 || true
          } > sonda-out/v78-openlist-api.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v78: API OpenList de BeatZ" || true
          git push || true
