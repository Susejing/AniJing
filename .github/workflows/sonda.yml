name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: ${{ !startsWith(github.event.head_commit.message, '[sonda]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sondear
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
          R="sonda-out/v47-resumen.txt"
          curlg() { curl -g -s -A "$UA" -m 50 "$1" -o "$2" 2>/dev/null; }
          jina() { for t in 1 2 3; do curl -g -s -m 70 "$1" -o "$2" 2>/dev/null; [ -s "$2" ] && break; sleep 12; done; }
          echo "SONDA V47" > $R
          echo "=== 1. fl crudo ===" >> $R
          curlg "https://www.mirrored.to/files/F38E5A6B/[Az-Animex]_Oshi_no_Ko_-_01_[BD][Kashikoi].mp4_links" fl.html
          echo "fl.html: $(wc -c < fl.html 2>/dev/null || echo 0)" >> $R
          grep -oE 'https://www.mirrored.to/files/F38E5A6B/[^"<> ]*hash=[^"<> ]*' fl.html | head -2 >> $R
          echo "=== 2. cadena jina con hid fresco ===" >> $R
          jina "https://r.jina.ai/https://www.mirrored.to/multilinks/fe371ce9c1" ml.md
          FIDURL=$(grep -oE "\(https://www.mirrored.to/files/[^)]*\)" ml.md | head -1 | tr -d "()")
          jina "https://r.jina.ai/$FIDURL" fl.md
          HASH=$(grep -oE "hash=[a-f0-9]+" fl.md | head -1)
          HASHPAGE=$(grep -oE "\(https://www.mirrored.to/files/[^)]*hash=[^)]*\)" fl.md | head -1 | tr -d "()")
          echo "hash: $HASH hashpage: $HASHPAGE" >> $R
          echo "=== 3. hp crudo vs jina ===" >> $R
          curlg "https://www.mirrored.to/files/F38E5A6B/?$HASH&dl=0" hp.html
          echo "hp.html: $(wc -c < hp.html 2>/dev/null || echo 0) getlinks-crudo: $(grep -c getlink hp.html)" >> $R
          grep -oE 'images/hosts/[a-z0-9_.-]+' hp.html | head -12 >> $R
          jina "https://r.jina.ai/$HASHPAGE" hp.md
          echo "hp.md: $(wc -c < hp.md 2>/dev/null || echo 0) getlinks-jina: $(grep -c getlink hp.md)" >> $R
          grep -oE '.{0,70}getlink/F38E5A6B/[0-9]+' hp.md | head -10 >> $R
          echo "=== 4. gl crudo: interior ===" >> $R
          GLVOE=$(grep -oE 'https://www.mirrored.to/getlink/F38E5A6B/156/[^)\" ]*' hp.md | head -1)
          echo "glvoe: $GLVOE" >> $R
          curlg "$GLVOE" gl.html
          echo "gl.html: $(wc -c < gl.html 2>/dev/null || echo 0)" >> $R
          grep -oE 'https?://[^"<> ]*(voe|streamtape|streamwish|lulu|filemoon)[^"<> ]*' gl.html | head -6 >> $R
          grep -oE '<iframe[^>]{0,220}' gl.html | head -3 >> $R
          grep -oE 'window\.location[^;]{0,160}' gl.html | head -3 >> $R
          grep -oE 'href="https?://[^"]{10,180}"' gl.html | grep -v mirrored.to | grep -vi google | head -8 >> $R
          grep -oE 'data-[a-z-]*url[a-z-]*="[^"]{10,180}"' gl.html | head -5 >> $R
          echo FIN >> $R
      - name: bitacora
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[sonda] log de fallo v47" --allow-empty
          git push
      - name: resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda-out
          git commit -m "[sonda] resultados v47" --allow-empty
          git push
