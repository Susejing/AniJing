name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: alist api
        run: |
          mkdir -p sonda-out
          : > sonda-out/alist.txt
          B="https://dire.az-animex.com"
          echo "== settings publicos" >> sonda-out/alist.txt
          curl -sL --max-time 30 "$B/api/public/settings" | head -c 800 >> sonda-out/alist.txt || true
          echo "" >> sonda-out/alist.txt
          echo "== fs/list /Anime" >> sonda-out/alist.txt
          curl -sL --max-time 30 -X POST "$B/api/fs/list" -H "Content-Type: application/json" -d '{"path":"/Anime","page":1,"per_page":50}' -o /tmp/anime.json || true
          head -c 700 /tmp/anime.json >> sonda-out/alist.txt || true
          echo "" >> sonda-out/alist.txt
          echo "== fs/list Monogatari" >> sonda-out/alist.txt
          curl -sL --max-time 30 -X POST "$B/api/fs/list" -H "Content-Type: application/json" -d '{"path":"/Anime/Monogatari Series - Second Season BD","page":1,"per_page":50}' -o /tmp/mono.json || true
          head -c 2500 /tmp/mono.json >> sonda-out/alist.txt || true
          echo "" >> sonda-out/alist.txt
          F=$(cat /tmp/mono.json | jq -r '.data.content[0].name' 2>/dev/null || true)
          echo "== primer archivo: $F" >> sonda-out/alist.txt
          if [ -n "$F" ] && [ "$F" != "null" ]; then
            P="/Anime/Monogatari Series - Second Season BD/$F"
            echo "== fs/get de \"$P\"" >> sonda-out/alist.txt
            jq -n --arg p "$P" '{path:$path}' > /tmp/req.json
            curl -sL --max-time 30 -X POST "$B/api/fs/get" -H "Content-Type: application/json" -d @/tmp/req.json | head -c 1200 >> sonda-out/alist.txt || true
            echo "" >> sonda-out/alist.txt
          fi
          echo "== cossette (solo serveraz+multiup)" >> sonda-out/alist.txt
          curl -sL --max-time 30 -X POST "$B/api/fs/list" -H "Content-Type: application/json" -d '{"path":"/Anime/Cossette no Shouzou BD","page":1,"per_page":50}' | head -c 600 >> sonda-out/alist.txt || true
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda-out
          git commit -m "sonda out" || true
          git push
