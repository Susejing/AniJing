name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v94
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== av1: paginación real del catálogo ====="
            curl -sL --max-time 25 -A "$UA" "https://animeav1.com/catalogo?page=1" -o /tmp/a1.html || true
            grep -oE 'pagination[^}]{0,120}' /tmp/a1.html | head -3 || true
            grep -oE '"total[A-Za-z]*":[0-9]+' /tmp/a1.html | sort -u | head -8 || true
            echo "--- items por página (tarjetas de media) ---"
            grep -c 'href="/media/' /tmp/a1.html || true
            echo "--- page 60 (¿existe el final?) ---"
            curl -sL --max-time 20 -A "$UA" "https://animeav1.com/catalogo?page=60" -o /tmp/a160.html -w 'status %{http_code}\n' || true
            grep -c 'href="/media/' /tmp/a160.html || true
            echo "===== eas: /anime estructura y paginación ====="
            curl -sL --max-time 25 -A "$UA" "https://www.estrenosanime.net/anime" -o /tmp/e.html || true
            grep -oE 'class="[^"]*"' /tmp/e.html | sort | uniq -c | sort -rn | head -8 || true
            grep -oE 'href="[^"]*anime[^"]*"' /tmp/e.html | sort -u | head -12 || true
            echo "--- ¿paginación? ---"
            grep -oE 'href="[^"]*(page|pag)[=/][0-9]+[^"]*"' /tmp/e.html | sort -u | head -8 || true
            curl -sL --max-time 15 -A "$UA" -o /tmp/e2.html -w 'status %{http_code} bytes %{size_download}\n' "https://www.estrenosanime.net/anime?page=2" || true
            curl -sL --max-time 15 -A "$UA" -o /tmp/e3.html -w 'status %{http_code} bytes %{size_download}\n' "https://www.estrenosanime.net/anime/page/2" || true
          } > sonda-out/v94-paginacion.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v94: paginación av1 y eas" || true
          git push || true
