name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v77
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            echo "===== HEAD del .mkv episodio 01 ====="
            curl -sIL --max-time 30 -A "$UA" "https://bz.beatz-anime.net/d/BeatZ-Anime/Anime/Bakemonogatari/%5BBeatZ-Anime%5D%20Bakemonogatari%20-%2001%20%5BBDRip%201080p%20HEVC-10bits%20FLAC%5D.mkv" | head -40 || true
            echo "===== carpeta navegabe (listing) ====="
            curl -sL --max-time 25 -A "$UA" "https://bz.beatz-anime.net/BeatZ-Anime/Anime/Bakemonogatari" | head -c 1500 || true
            echo ""
            echo "===== catálogo lista-animes ====="
            curl -sL --max-time 30 -A "$UA" "https://www.beatz-anime.net/lista-animes/index.php" -o /tmp/la.html || true
            grep -o 'href="[^"]*bd/[^"]*\.html"' /tmp/la.html | sort -u | head -8 || true
            grep -o 'href="[^"]*bd/[^"]*\.html"' /tmp/la.html | sort -u | wc -l || true
            echo "--- ¿paginación? ---"
            grep -o 'page[_=-][0-9]*\|pagina[^"<]*' /tmp/la.html | sort -u | head -10 || true
          } > sonda-out/v77-beatz-directo.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v77: headers del mkv directo de BeatZ" || true
          git push || true
