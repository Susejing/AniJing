name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sonda v97
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          {
            for S in 3-gatsu-no-lion 3-gatsu-no-lion-2 5-toubun-no-hanayome bakemonogatari overgeared; do
              curl -sL --max-time 15 -A "$UA" -o /dev/null -w "$S -> %{http_code} %{content_type}\n" "https://www.beatz-anime.net/img/img-anime/$S/$S-port.jpg" || true
            done
          } > sonda-out/v97-posters.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v97: patrón de pósters beatz" || true
          git push || true
