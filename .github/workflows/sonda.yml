name: sonda
on: push
permissions:
  contents: write
jobs:
  sonda:
    if: ${{ !startsWith(github.event.head_commit.message, '[sonda]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sondear
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
          R="sonda-out/v44-resumen.txt"
          bajar() { curl -sL -A "$UA" -m 45 "$1" -o "$2" 2>/dev/null; echo "$2: $(wc -c < "$2" 2>/dev/null || echo 0)" >> $R; }
          echo "SONDA V44" > $R
          echo "=== A. multilink crudo diagnostico ===" >> $R
          bajar "https://www.mirrored.to/multilinks/fe371ce9c1" ml.html
          head -c 1200 ml.html >> $R
          echo "" >> $R
          echo "apariciones files/: $(grep -c "files/" ml.html)" >> $R
          echo "=== B. multilink via jina (markdown FIDs) ===" >> $R
          bajar "https://r.jina.ai/https://www.mirrored.to/multilinks/fe371ce9c1" ml.md
          echo "enlaces _links en jina: $(grep -c "_links" ml.md)" >> $R
          grep -oE 'files/[A-F0-9]+/[^) ]*_links' ml.md | head -3 >> $R
          echo "=== C. files _links via jina (hash) ===" >> $R
          bajar "https://r.jina.ai/https://www.mirrored.to/files/F38E5A6B/[Az-Animex]_Oshi_no_Ko_-_01_[BD][Kashikoi].mp4_links" fl.md
          grep -oE 'hash=[a-f0-9]+' fl.md | head -2 >> $R
          HASH=$(grep -oE "hash=[a-f0-9]+" fl.md | head -1)
          echo "hash extraido: $HASH" >> $R
          echo "=== D. hash-page via jina (getlinks) ===" >> $R
          bajar "https://r.jina.ai/https://www.mirrored.to/files/F38E5A6B/?$HASH&dl=0" hp.md
          echo "getlinks en jina: $(grep -c "getlink" hp.md)" >> $R
          grep -oE 'getlink/[A-F0-9]+/[0-9]+/[^) "]*' hp.md | head -10 >> $R
          echo "=== E. getlink crudo redirect ===" >> $R
          GLVOE=$(grep -oE 'https://www.mirrored.to/getlink/F38E5A6B/156/[^) "]*' hp.md | head -1)
          echo "voe getlink: $GLVOE" >> $R
          curl -s -o /dev/null -A "$UA" -m 40 -w "voe-redirect: %{http_code} -> %{redirect_url}\n" "$GLVOE" >> $R
          GLTAPE=$(grep -oE 'https://www.mirrored.to/getlink/F38E5A6B/149/[^) "]*' hp.md | head -1)
          curl -s -o /dev/null -A "$UA" -m 40 -w "tape-redirect: %{http_code} -> %{redirect_url}\n" "$GLTAPE" >> $R
          echo "=== F. az directorio: estructura entrada con imagen ===" >> $R
          bajar "https://www.az-animex.com/directorio-anime/" azd.html
          tr '\n' ' ' < azd.html | grep -oE '.{900}[a-z0-9-]+/" target="_self".{700}' | head -1 | cut -c1-1600 >> $R
          echo "" >> $R
          echo "=== G. az ficha: anchors y sinopsis ===" >> $R
          bajar "https://www.az-animex.com/oshi-no-ko/" azf.html
          grep -oE '<a[^>]{0,280}multilinks' azf.html | head -2 >> $R
          tr '\n' ' ' < azf.html | grep -oE 'post-excerpt[^>]{0,80}>.{0,550}' | head -1 >> $R
          echo "" >> $R
          grep -oE 'col1-(topspan|mega|mirror)[^>]{0,70}>[^<]{0,50}' azf.html | grep -v hover | head -5 >> $R
          echo FIN >> $R
      - name: bitacora
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[sonda] log de fallo v44" --allow-empty
          git push
      - name: resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda-out
          git commit -m "[sonda] resultados v44" --allow-empty
          git push
