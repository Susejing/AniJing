name: sonda
on:
  push:
    branches: [main]
jobs:
  sonda:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sondas v79
        run: |
          mkdir -p sonda-out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          sondea() {
            local NOMBRE="$1"; shift
            {
              for URL in "$@"; do
                echo "===== $URL ====="
                COD=$(curl -sL --max-time 25 -A "$UA" -o /tmp/p.html -w '%{http_code}' "$URL" || true)
                echo "status $COD, bytes $(wc -c < /tmp/p.html 2>/dev/null || echo 0)"
                grep -o 'wp-content\|dooplay\|doo_player_ajax\|dt_player' /tmp/p.html | sort | uniq -c | head -5 || true
                grep -oiE 'https?://[^"'"'"' <>]*(mega\.nz|drive\.google|zippyshare|pixeldrain|krakenfiles|gofile|fireload|terabox|streamtape|voe\.|filemoon|streamwish|mp4upload|dood|uqload|yourupload|mixdrop|ok\.ru|savefiles|lulustream|vidhide|byse)[^"'"'"' <>]*' /tmp/p.html | sort -u | head -12 || true
                grep -oE 'href="[^"]*(/anime|/serie|/series|/catalogo|/directorio|/pelicula)[^"]*"' /tmp/p.html | sort -u | head -10 || true
              done
            } > "sonda-out/v79-$NOMBRE.txt" 2>&1 || true
          }
          sondea kurosaki "https://teamkurosaki.net/" "https://teamkurosaki.net/animes/"
          sondea sphinx "https://sphinxanime.com/" "https://sphinxanime.com/animes/"
          sondea shadow "https://shadowrangers.net/" "https://shadowrangers.net/animes/"
          sondea dengeki "https://dengekiplus.com/" "https://www.dengeki-plus.com/" "https://dengeki-plus.com/"
          sondea gx "https://animegx.com/" "https://www.animegx.org/" "https://animegx.org/"
      - name: commit
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-out || true
          git commit -m "sonda v79: reconocimiento de 5 sitios candidatos" || true
          git push || true
