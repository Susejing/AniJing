name: sonde
on: push
permissions:
  contents: write
jobs:
  sonde:
    if: contains(github.event.head_commit.message, '[sonda]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sonda v54
        run: |
          mkdir -p sonda-out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          curl -sL --max-time 20 -A "$UA" 'https://www.az-animex.com/wp-json/wp/v2/posts?per_page=40&orderby=title&order=asc&page=1&_fields=slug,title,_links' -o sonda-out/api-links.json || true
          IDS=$(cat sonda-out/api-links.json | tr ',' '\n' | grep -o '"featured_media":{"href":"[^"]*"' | grep -o '[0-9]\{3,7\}/$' | tr -d '/' | head -40 | paste -sd, -) || true
          echo "IDS=$IDS" > sonda-out/ids.txt || true
          if [ -n "$IDS" ]; then curl -sL --max-time 20 -A "$UA" "https://www.az-animex.com/wp-json/wp/v2/media?include=$IDS&per_page=40&_fields=id,source_url,media_details" -o sonda-out/api-media-inc.json || true; fi || true
          curl -sI --max-time 20 'https://www.az-animex.com/wp-content/uploads/2023/12/descargar-1.jpg' > sonda-out/og-head.txt 2>&1 || true
          curl -s --max-time 20 'https://www.az-animex.com/wp-content/uploads/2023/12/descargar-1.jpg' -o /dev/null -w 'sinUA-Referer: HTTP %{http_code} type %{content_type} len %{size_download}\n' >> sonda-out/og-head.txt || true
          curl -sL --max-time 20 -A "$UA" 'https://www.az-animex.com/bungaku-shoujo-memoire/' -o sonda-out/f-memoire.html || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sonda-out
          git commit -m 'sonda out v54' || true
          git push
