name: sonda-v38
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sonda:
    if: ${{ !startsWith(github.event.head_commit.message, '[sonda]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: medir
        run: |
          curl -s -m 25 -A "Kino/0.9.84" -e "https://ivanime.buzz/" "https://ivanime.buzz/emision" -o /tmp/emision.html
          echo "bytes emision: $(wc -c < /tmp/emision.html)" > sonda-resultado.txt
          SLUG=$(grep -oE "/anime/[a-z0-9-]+" /tmp/emision.html | head -1 | sed "s|/anime/||")
          echo "slug: $SLUG" >> sonda-resultado.txt
          curl -s -m 25 -A "Kino/0.9.84" -e "https://ivanime.buzz/" "https://ivanime.buzz/anime/$SLUG/" -o /tmp/ficha.html
          echo "bytes ficha: $(wc -c < /tmp/ficha.html)" >> sonda-resultado.txt
          echo "== primeros 4000 chars ==" >> sonda-resultado.txt
          head -c 4000 /tmp/ficha.html >> sonda-resultado.txt
          echo "" >> sonda-resultado.txt
          echo "== meta tags ==" >> sonda-resultado.txt
          grep -oE "<meta[^>]*>" /tmp/ficha.html >> sonda-resultado.txt || echo "(sin meta)" >> sonda-resultado.txt
          echo "== urls de imagen ==" >> sonda-resultado.txt
          grep -oE "https?://[^\" ]+\.(jpg|jpeg|png|webp)[^\" ]*" /tmp/ficha.html | head -40 >> sonda-resultado.txt || echo "(sin urls)" >> sonda-resultado.txt
          echo "== ventana h1 ==" >> sonda-resultado.txt
          H1POS=$(grep -boE "<h1[^>]*>" /tmp/ficha.html | head -1 | cut -d: -f1)
          echo "h1 en byte: $H1POS" >> sonda-resultado.txt
          if [ -n "$H1POS" ]; then
            INI=$(( H1POS - 800 )); [ "$INI" -lt 0 ] && INI=0
            tail -c +$(( INI + 1 )) /tmp/ficha.html | head -c 2200 >> sonda-resultado.txt
          fi
          echo "" >> sonda-resultado.txt
          echo "== FIN ==" >> sonda-resultado.txt
      - name: publicar
        run: |
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add sonda-resultado.txt
          git commit -m "[sonda] resultados v38"
          git push
